<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call & Signal: highway construction communication trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a33; --ink-2:#51606a; --paper:#e4e7e3; --paper-2:#f3f4f1; --line:#c2c8c3;
  --go:#1e7a4c; --go-bg:#d9eee1; --stop:#b42318; --stop-bg:#f6dcd7; --amber:#b86e00;
  --lcd:#b8c39d; --lcd-ink:#18200f; --lcd-dim:#4f5c3d; --radio-body:#2a3137;
  --stage-ui:rgba(243,244,241,.9); --focus:#1d5fbf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e3e8e4; --ink-2:#a3b0aa; --paper:#1d2327; --paper-2:#262e33; --line:#3a454c;
    --go:#56c48f; --go-bg:#163126; --stop:#ff8a7a; --stop-bg:#3b1e1a; --amber:#f0a640;
    --lcd:#232c1c; --lcd-ink:#cfe0a4; --lcd-dim:#8d9d70; --radio-body:#12171a;
    --stage-ui:rgba(29,35,39,.88); --focus:#7fb0ff;
  }
}
:root[data-theme="dark"]{
  --ink:#e3e8e4; --ink-2:#a3b0aa; --paper:#1d2327; --paper-2:#262e33; --line:#3a454c;
  --go:#56c48f; --go-bg:#163126; --stop:#ff8a7a; --stop-bg:#3b1e1a; --amber:#f0a640;
  --lcd:#232c1c; --lcd-ink:#cfe0a4; --lcd-dim:#8d9d70; --radio-body:#12171a;
  --stage-ui:rgba(29,35,39,.88); --focus:#7fb0ff;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px}
#card{position:relative}
#stage{position:relative;overflow:hidden;min-width:0;min-height:0;background:#a9c6da}
#stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:600 18px "Barlow Condensed",sans-serif;color:#1d2a33;pointer-events:none}

/* HUD over the 3D view */
#hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.sc-chip{background:var(--stage-ui);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:6px 12px 7px;align-self:flex-start}
.sc-title{font:700 24px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.sc-sub{font-size:13px;color:var(--ink-2)}
.stats{display:flex;gap:6px}
.stat{background:var(--stage-ui);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:5px 11px 6px;min-width:78px}
.stat b{display:block;font:700 23px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.stat.low b{color:var(--stop)}
.phys{background:var(--stage-ui);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:5px 11px 7px;align-self:flex-start;max-width:330px}
.phys[hidden]{display:none}
.phys h4{margin:0 0 2px;font:600 12px/1.3 "Barlow",system-ui,sans-serif;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.phys b{font:700 23px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.phys b.warn{color:var(--amber)}.phys b.over{color:var(--stop)}
.phys span{font-size:12px;color:var(--ink-2)}
.phys .bar{height:6px;border-radius:3px;background:rgba(128,128,128,.25);margin:4px 0 3px;overflow:hidden}
.phys .bar i{display:block;height:100%;background:var(--go)}
.phys .bar i.warn{background:var(--amber)}.phys .bar i.over{background:var(--stop)}
.phys p{margin:0;font-size:12px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pdata{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px}
.pdata td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.pdata td+td{text-align:right;font-weight:600;padding-left:10px;white-space:nowrap}
.pdata small{display:block;font-weight:400;color:var(--ink-2);white-space:normal}

#toolbar{position:absolute;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:62%}
.tb{display:flex;gap:2px;background:var(--stage-ui);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:3px}
.tb button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tb button:hover{background:rgba(128,128,128,.18)}
.tb button.on,.tb button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:12px;font-weight:600;line-height:1.2;background:rgba(22,30,36,.8);color:#fff;padding:3px 7px;border-radius:4px;white-space:nowrap;will-change:transform}
.tag.place{background:rgba(255,255,255,.78);color:#1d2a33;font-weight:500}
.tag.you{background:#ffc61a;color:#16140c;box-shadow:0 0 0 2px #16140c}

/* The laminated hand-signal card */
#sigCard{position:absolute;left:12px;bottom:12px;width:310px;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;
  background:#ffc61a;color:#16140c;border-radius:12px;padding:9px 14px 9px 9px;box-shadow:inset 0 0 0 3px #16140c,0 10px 28px rgba(0,0,0,.28);
  opacity:0;transform:translateY(14px);transition:opacity .22s,transform .22s;pointer-events:none}
#sigCard.show{opacity:1;transform:none}
#sigFig svg{width:92px;height:115px;display:block;background:#fff4c4;border-radius:7px}
#sigWho{font-size:12px;font-weight:600}
#sigName{font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:1px 0 4px}
#sigHow{font-size:13px;line-height:1.35}
#sigSrc{font-size:11.5px;margin-top:5px;opacity:.72}

#banner{position:absolute;left:50%;top:84px;transform:translate(-50%,-8px);max-width:min(560px,86%);padding:9px 16px;border-radius:9px;
  background:#b42318;color:#fff;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.good{background:#1e7a4c}

/* Training panel */
#panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--paper)}
.p-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand-name{font:700 23px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.brand-sub{font-size:13px;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 9px;cursor:pointer;text-align:left;font-weight:600;font-size:14px;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:1px}
.seg button:hover{background:rgba(128,128,128,.14)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.seg.mini{grid-template-columns:auto auto}
.seg.mini button{padding:4px 11px;font-size:13px;text-align:center}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px}

.steps{list-style:none;margin:0;padding:10px 16px 0;display:flex;gap:4px}
.steps li{flex:1;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;
  font:600 12.5px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink-2)}
.steps li.cur{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 #ffc61a}
.steps li.ok{background:var(--go);border-color:var(--go);color:var(--paper)}
.steps li.retry{background:var(--amber);border-color:var(--amber);color:var(--paper)}

.card{padding:12px 16px 14px;overflow-y:auto;flex:1 1 auto;min-height:0}
.role{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:3px 10px 3px 7px;border-radius:999px;background:#ffc61a;color:#16140c}
.role i{width:8px;height:8px;border-radius:50%;background:#16140c}
.role.timed{background:#b42318;color:#fff}.role.timed i{background:#fff}
.card h2{font:700 26px/1.08 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 5px}
.situ{margin:0 0 10px;max-width:62ch}
.q{font-weight:600;margin:0 0 8px}
.timer{height:6px;border-radius:3px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;margin:2px 0 10px}
.timer i{display:block;height:100%;background:#b42318;transform-origin:left center}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:9px 10px;cursor:pointer;line-height:1.36}
.opt.has-ico{grid-template-columns:24px 40px 1fr}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);font:700 15px "Barlow Condensed","Arial Narrow",sans-serif}
.opt .ico svg{width:40px;height:50px;display:block;background:#fff4c4;border-radius:5px;border:1.5px solid #16140c}
.opt .t b{display:block;font-weight:600}
.opt.right{border-color:var(--go);background:var(--go-bg)}
.opt.right .k{background:var(--go);border-color:var(--go);color:var(--paper)}
.opt.wrong{border-color:var(--stop);background:var(--stop-bg)}
.opt.wrong .k{background:var(--stop);border-color:var(--stop);color:var(--paper)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;border-left:4px solid;font-size:14px;line-height:1.42}
.fb.good{border-color:var(--go);background:var(--go-bg)}
.fb.bad{border-color:var(--stop);background:var(--stop-bg)}
.fb.late{border-color:var(--amber);background:var(--paper-2)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:12px;width:100%;padding:11px 14px;border:0;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.next:disabled{opacity:.5;cursor:progress}
.next.go{background:#ffc61a;color:#16140c;box-shadow:inset 0 0 0 2px #16140c}

.brief h3,.debrief h3{font:700 17px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:14px 0 5px}
.brief p{margin:0 0 6px;max-width:62ch}
.crew{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
.crew dt{font-weight:600}.crew dd{margin:0;color:var(--ink-2)}
.crew dt.me::after{content:" (you)";color:var(--ink);font-weight:500}
.rules{margin:0;padding-left:18px;font-size:14px}
.rules li{margin:2px 0}
.zkey{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.dstats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.dstats div{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.dstats b{display:block;font:700 24px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.dstats span{font-size:12px;color:var(--ink-2)}
.verdict{padding:9px 12px;border-radius:8px;background:var(--paper-2);border-left:4px solid var(--ink);margin:8px 0}
.dlist{list-style:none;margin:0;padding:0;font-size:14px}
.dlist li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.dlist .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--paper);background:var(--go)}
.dlist li.retry .m{background:var(--amber)}
.dlist li.late .m{background:var(--stop)}
.dlist b{display:block}
.dlist span{color:var(--ink-2)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .next{margin-top:0}

/* Handheld radio */
.radio{flex:0 0 auto;height:clamp(130px,22vh,240px);display:flex;flex-direction:column;margin:0 16px 14px;background:var(--radio-body);border-radius:12px;padding:7px 8px 8px}
.radio-head{display:flex;align-items:center;gap:8px;color:#c7d0d5;font-size:12.5px;padding:1px 4px 6px}
.radio-head .sp{flex:1}
.led{width:9px;height:9px;border-radius:50%;background:#4a5258;transition:background .1s,box-shadow .1s}
.led.tx{background:#ff4b36;box-shadow:0 0 9px #ff4b36}
.log{list-style:none;margin:0;padding:8px 10px;flex:1;min-height:0;overflow-y:auto;background:var(--lcd);color:var(--lcd-ink);border-radius:7px;
  font:500 15px/1.32 "Barlow Condensed","Arial Narrow",sans-serif;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.log li{padding:2px 0}
.log .who{font-weight:700;margin-right:6px}
.log .k-you .who::after{content:" (you)";font-weight:500}
.log .k-horn{font-style:italic}
.log .k-static,.log .k-note{color:var(--lcd-dim);font-style:italic}
.log .k-alien .who{text-decoration:underline wavy}
.log .empty{color:var(--lcd-dim)}

/* scroll shadows so it is obvious when more answers sit below the fold */
@media (min-width: 901px){
  .card{background:
    linear-gradient(var(--paper) 30%, transparent) top / 100% 26px no-repeat local,
    linear-gradient(transparent, var(--paper) 70%) bottom / 100% 26px no-repeat local,
    radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.22), transparent) top / 100% 12px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.22), transparent) bottom / 100% 12px no-repeat scroll;
    background-color:var(--paper)}
}
@media (min-width: 901px) and (max-height: 820px){
  .p-head{padding:10px 16px 8px}
  .brand{margin-bottom:7px}
  .seg button small{display:none}
  .mode-row{margin-top:6px}
  .steps{padding-top:8px}
  .card h2{font-size:23px;margin:6px 0 4px}
  .situ{font-size:14.5px}
  .radio{height:clamp(118px,19vh,200px)}
}
@media (max-width: 900px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  #panel{border-left:0;border-top:1px solid var(--line);overflow-y:auto}
  #panel>*{flex-shrink:0}
  .card{flex:0 0 auto;max-height:none;overflow:visible}
  .radio{flex:0 0 auto;height:230px}
  .tb button{padding:5px 8px;font-size:12.5px}
  .sc-chip{display:none}
  #toolbar{top:auto;bottom:10px;left:10px;right:10px;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  #sigCard{left:10px;right:10px;bottom:54px;width:auto;grid-template-columns:52px 1fr;padding:6px 10px 6px 6px;gap:9px}
  #sigFig svg{width:52px;height:65px}
  #sigName{font-size:20px;margin-bottom:2px}
  #sigHow{font-size:12px}
  #sigSrc{display:none}
  .stat{min-width:0;padding:4px 9px 5px}
  .stat b{font-size:19px}
  #banner{top:68px}
}
@media (max-width: 480px){
  .brand-sub{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
.ev{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.ev summary{cursor:pointer;padding:7px 10px;font-weight:600;font-size:13.5px}
.ev summary .ev-draft{font-weight:500;font-size:12px;color:var(--ink-2);margin-left:4px}
.ev>div{padding:0 10px 9px}
.ev-q{margin:8px 0;padding:6px 9px;border-left:3px solid var(--line);background:var(--paper-2);border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.4}
.ev-q q{quotes:"\201C" "\201D"}
.ev-q cite{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:3px}
.ev-q cite a{color:inherit}
.ev-force{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 5px;margin-right:6px;border-radius:3px;background:var(--ink);color:var(--paper)}
.ev-force.f-should,.ev-force.f-may{background:var(--ink-2)}
.ev-force.f-explains,.ev-force.f-example{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.ev-note,.ev-cnf,.ev-vid,.ev-ctx{font-size:13px;margin:7px 0;line-height:1.4}
.ev-cnf{padding:6px 9px;border-radius:6px;background:var(--stop-bg)}
.ev-vid a,.ev-ctx a{color:inherit}
.ev-flag{display:block;font-size:12px;color:var(--ink-2)}
.ev-meta{margin-top:10px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}
.ev-meta ul{margin:4px 0 6px;padding-left:18px}
</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="3D job site">
    <div id="loading">Setting up the job site…</div>
    <div id="tags" aria-hidden="true"></div>
    <header id="hud">
      <div class="sc-chip"><div class="sc-title" id="scTitle">Girder delivery</div><div class="sc-sub" id="scSub"></div></div>
      <div class="stats" aria-live="polite">
        <div class="stat" id="statSafety"><b id="stSafety">100</b><span>Safety</span></div>
        <div class="stat"><b id="stFirst">0 of 0</b><span>Right first time</span></div>
        <div class="stat"><b id="stLost">0:00</b><span>Lost time</span></div>
      </div>
      <div class="phys" id="phys" hidden aria-live="off"></div>
    </header>
    <div id="toolbar">
      <div class="tb"><a href="index.html" style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;color:inherit;white-space:nowrap">← All modules</a></div>
      <div class="tb" id="camBtns" role="group" aria-label="Camera">
        <button data-cam="overview" class="on">Overview</button>
        <button data-cam="operator">Operator</button>
        <button data-cam="driver">Truck cab</button>
        <button data-cam="signal">Signal person</button>
        <button data-cam="top">Plan</button>
      </div>
      <div class="tb" id="speedBtns" role="group" aria-label="Playback speed">
        <button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
      </div>
      <div class="tb">
        <button id="zonesBtn" aria-pressed="true" title="Show hazard zones">Zones</button>
        <button id="soundBtn" aria-pressed="false" title="Radio voices and horn">Sound</button>
      </div>
    </div>
    <div id="banner" role="status"></div>
    <aside id="sigCard" aria-live="polite">
      <div id="sigFig"></div>
      <div><div id="sigWho"></div><div id="sigName"></div><div id="sigHow"></div><div id="sigSrc"></div></div>
    </aside>
  </main>

  <section id="panel" aria-label="Training">
    <div class="p-head">
      <div class="brand"><span class="brand-name">Call &amp; Signal</span><span class="brand-sub">Highway construction trainer</span></div>
      <div class="seg" role="tablist" aria-label="Scenario" id="scTabs">
        <button role="tab" data-sc="crane" aria-selected="true">Crane + flatbed<small>Precast girder for the overpass</small></button>
        <button role="tab" data-sc="exc" aria-selected="false">Excavator + dump trucks<small>Loading out the widening cut</small></button>
      </div>
      <div class="mode-row">
        <div class="seg mini" role="tablist" aria-label="Mode" id="modeTabs">
          <button role="tab" data-mode="practice" aria-selected="true">Practice</button>
          <button role="tab" data-mode="demo" aria-selected="false">Watch demo</button>
        </div>
        <button class="linkbtn" id="restartBtn">Restart scenario</button>
      </div>

window.CALLSIGNAL_PACK = {"trainer": "construction", "scenarios": {"crane": {"key": "crane", "title": "Girder delivery", "sub": "Mobile crane, flatbed, signal person and rigger at the new overpass", "channel": "Channel 4", "camLabels": {"operator": "Crane cab", "driver": "Truck cab", "signal": "Signal person"}, "briefKeys": ["signal"], "briefCall": "Signal", "briefing": "\n    <p>This highway job is building a new overpass. Truck 12 is bringing a 28-ft precast concrete bulb-tee girder segment. The crane picks it off the trailer at the painted mark, swings it 90° to the operator's left, and sets it on storage dunnage beside the bridge for the girder-setting crew. Live highway traffic runs just past the north fence.</p>\n    <h3>What the load weighs, and what the crane can take</h3>\n    <table class=\"pdata\">\n      <tr><td>Girder<small>PCI BT-54 section, {{LIFT.AREA_IN2}} in² × {{LIFT.LEN_FT}} ft × {{LIFT.PCF}} lb/ft³ (AASHTO LRFD 3.5.1: f′c = {{PV('concrete.fc_ksi')}} ksi concrete, plus 5 lb/ft³ for reinforcement)</small></td><td>{{fmtLb(LIFT.GIRDER_KG)}}</td></tr>\n      <tr><td>Hook block and rigging<small>Single-sheave block on 2 parts of line, two wire-rope slings, two shackles. They count as part of the load.</small></td><td>{{fmtLb((LIFT.HOOK_BLOCK_LB + LIFT.RIGGING_LB) * LBKG)}}</td></tr>\n      <tr><td><b>Total load on the hook</b></td><td>{{fmtLb(LIFT.HOOK_KG)}} ({{fmtT(LIFT.HOOK_KG)}})</td></tr>\n      <tr><td>Load radius<small>From the centre of rotation; the same at the pick and the landing</small></td><td>{{(CR.R / M_PER_FT).toFixed(1)}} ft ({{CR.R.toFixed(1)}} m)</td></tr>\n      <tr><td>Rated capacity at that radius<small>Representative values from a published 90-t-class, 4-axle all-terrain crane chart: 74-ft boom, 49,600-lb counterweight, outriggers fully extended, 360°. Ratings are no more than {{PV('crane.chart_pct_of_tipping')}}% of the tipping load (the chart cites ASME B30.5).</small></td><td>{{fmtLb(chartKg(CR.R))}}</td></tr>\n      <tr><td><b>Share of chart used</b></td><td>{{chartPct()}}%</td></tr>\n      <tr><td>Tension in each sling leg<small>Two-leg bridle at 60°: girder weight ÷ 2 ÷ sin 60°</small></td><td>{{fmtLb(LIFT.LEG_KG)}}</td></tr>\n      <tr><td>Hoist capacity<small>{{LIFT.PARTS}} parts × {{LIFT.LINE_PULL_LB.toLocaleString('en-US')}}-lb single-line pull. Line speed {{LIFT.LINE_FPM}} ft/min, so the hook moves at most {{Math.round(LIFT.LINE_FPM / LIFT.PARTS)}} ft/min.</small></td><td>{{fmtLb(LIFT.HOIST_CAP_KG)}}</td></tr>\n      <tr><td>Swing speed<small>Rated maximum {{LIFT.SLEW_RPM}} rpm. The loaded swing here stays under 1 rpm, so the girder doesn't swing out.</small></td><td>≤ {{LIFT.SLEW_RPM}} rpm</td></tr>\n    </table>\n    <p style=\"font-size:13px;color:var(--ink-2)\">These are training values. A real lift uses the manufacturer's chart for the actual crane and configuration, verified weights, and the site lift plan. At {{chartPct()}}% of chart, this lift is close to the 75% mark that many contractors use to require a critical-lift plan. Watch the <b>Crane load</b> readout: when the girder swings out, the radius grows and the crane is using more of its chart.</p>\n    <p style=\"font-size:13px;color:var(--ink-2)\"><b>Compliance basis:</b> OSHA 29 CFR 1926.1419–1422 and 1926.1428. The signal person must be qualified/documented under 1926.1428; electronic signaling must be tested and reliable under 1926.1420; voice-signal participants and sequence follow 1926.1421; and the hand-signal chart is posted under 1926.1422. Standard hand signals shown here use OSHA Subpart CC Appendix A. <b>Training timer note:</b> any countdown timer in this simulator is an instructional response window, not an OSHA response-time threshold.</p>\n    <h3>Crew</h3>\n    <dl class=\"crew\">\n      <dt>Crane 1</dt><dd>Crane operator</dd>\n      <dt class=\"me\">Signal</dt><dd>Signal person. You play this role most of the time.</dd>\n      <dt>Truck 12</dt><dd>Flatbed driver</dd>\n      <dt>Rigger</dt><dd>Hooks up the load and runs the tag line</dd>\n    </dl>\n    <p style=\"margin-top:8px\">In some steps you'll switch seats and play the crane operator or the truck driver.</p>\n    <h3>Agreed communication</h3>\n    <ul class=\"rules\">\n      <li>Channel 4 is for this lift only.</li>\n      <li>Only Signal gives moving calls to the crane. Anyone can call \"all stop.\"</li>\n      <li>Voice calls go: function, direction, distance or speed, then \"stop.\"</li>\n      <li>OSHA Standard Method hand signals (29 CFR 1926 Subpart CC Appendix A) back up the radio; non-standard signals are used only under the conditions allowed by 1926.1419.</li>\n      <li>If the radio drops, the operator stops and holds until communication is re-established and a proper signal is understood (1926.1419(f)).</li>\n      <li>The signal person is qualified and documented for the signals used (1926.1428), and the hand-signal chart is posted on the equipment or conspicuously near the hoisting operation (1926.1422).</li>\n    </ul>\n    <h3>On the ground</h3>\n    <ul class=\"rules\">\n      <li><span class=\"zkey\" style=\"background:#d8261c\"></span>Red: <b>site-defined no-entry visualization</b> for the counterweight swing area and area beneath/around the suspended load. OSHA does not prescribe the 5.2 m graphic radius used by this model as a universal fall-zone distance.</li>\n      <li><span class=\"zkey\" style=\"background:#ffc61a\"></span>Yellow: the load's swing path</li>\n      <li><span class=\"zkey\" style=\"background:#1e9a5c\"></span>Green: driver safe zone selected by this lift/site plan; it is not a nationally prescribed fixed distance.</li>\n    </ul>", "scenario_family": "S1_CRANE_TRUCK", "conflicts": [{"id": "CNF-002", "title": "§1926.201(b) refers crane/hoist signals to ANSI standards; Subpart CC (§§1926.1419–1422) prescribes crane signals", "status": "OPEN", "implication": "Two OSHA texts point to different signaling references for cranes.", "handling": "Cite Subpart CC as the operative text for equipment within its scope. Keep §1926.201(b) as a legacy cross-reference flagged for legal review. Do not cite ANSI/ASME chart details unless the consensus standard is obtained.", "decision_by": "PI / legal-regulatory reviewer"}, {"id": "CNF-010", "title": "OSHA plans to amend Subpart CC (RIN 1218-AC81); NPRM timetabled for 11/2026", "status": "WATCH", "implication": "Wording, normative force (must vs may) or the hand-signal figure could change during the study period.", "handling": "Freeze the corpus to the eCFR snapshot dated 2026-10-05 for the study, monitor the Federal Register for RIN 1218-AC81, and re-run scripts/fetch_ecfr.py plus the build if an NPRM or final rule appears. A proposed rule does not change current requirements.", "decision_by": "PI (monitoring plan)"}], "steps": [{"id": "radio", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Open the channel", "timed": null, "situation": "Everyone is in position. Truck 12 is idling at the west gate with the girder. Nothing moves until the crew can hear each other.", "question": "How do you start the lift communication?", "lateBanner": null, "lateText": null, "lesson": "Meet OSHA's crane communication requirements first; this scenario then uses a truck-driver radio check and read-back as an additional site closed-loop control.", "options": [{"correct": true, "text": "On channel 4, confirm you are the only signal and that anyone can call all-stop, then get a read-back from Crane 1 and Truck 12.", "why": "OSHA 1926.1421(a) requires the operator, signal person and lift director (if there is one) to contact each other and agree on the voice signals before operations. OSHA 1926.1420 also requires electronic signaling devices to be tested on site for effective, clear and reliable transmission. Including the truck driver and using a read-back are additional closed-loop controls used by this scenario, not a universal OSHA read-back requirement."}, {"text": "Wave Truck 12 through the gate now to save time, and sort out the radios once the girder is rigged.", "why": "Once the girder is rigged, a radio problem means a load in the air and no way to talk to the operator. Set up the channel and the single-signal rule before the truck moves.", "risk": 15, "lost": 90, "banner": "Load rigged with no working radios"}, {"text": "Run the lift on the main site channel, so the foreman and every other crew on the job can hear each call and stay out of the way.", "why": "A shared channel gets stepped on. If a \"stop\" is missed in the middle of a swing, the load keeps moving. Use a dedicated channel for the lift.", "risk": 15, "lost": 45, "banner": "Lift calls stepped on by site traffic"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-012", "decision": "When must the crew (re)agree on voice signals?", "correct_action": "Before beginning operations, the operator, signal person, and lift director (if any) contact each other and agree on the voice signals; they meet again whenever another worker is added or substituted, there is confusion about the voice signals, or a voice signal is to be changed.", "force": "must", "locator": "29 CFR 1926.1421(a)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1421(a)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1421", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Prior to beginning operations, the operator, signal person and lift director (if there is one), must contact each other and agree on the voice signals that will be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1421(a)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1421", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "these workers need not meet again to discuss voice signals unless another worker is added or substituted, there is confusion about the voice signals, or a voice signal is to be changed.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-011", "decision": "What must be in place before and during radio signaling?", "correct_action": "Test the devices on site before beginning operations to confirm transmission is effective, clear, and reliable; transmit signals on a dedicated channel; and the operator receives signals through a hands-free system.", "force": "must", "locator": "29 CFR 1926.1420(a)-(c)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1420(a)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1420", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The device(s) used to transmit signals must be tested on site before beginning operations to ensure that the signal transmission is effective, clear, and reliable.", "verified": "PASS"}, {"citation": "29 CFR 1926.1420(b)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1420", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Signal transmission must be through a dedicated channel, except:", "verified": "PASS"}, {"citation": "29 CFR 1926.1420(c)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1420", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The operator's reception of signals must be by a hands-free system.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-009", "decision": "Who may give signals to the crane?", "correct_action": "Only one person gives signals to the crane at a time (the designated signal person); everyone else limits themselves to the stop/emergency stop signal.", "force": "must", "locator": "29 CFR 1926.1419(h)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": true, "review_reasons": ["Operator response to conflicting signals is inferred from §1926.1419(g); the text of (h) states only the one-signaler rule."], "quotes": [{"citation": "29 CFR 1926.1419(h)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Only one person may give signals to a crane/derrick at a time, except in circumstances covered by paragraph (j) of this section.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-006", "decision": "Must the operator obey a stop signal from someone who is not the designated signal person?", "locator": "29 CFR 1926.1417(y)", "force": "must"}, {"atom_id": "ATM-S1-019", "decision": "What must be confirmed before this person gives any signals?", "locator": "29 CFR 1926.1428(a)-(c)", "force": "must"}, {"atom_id": "ATM-S1-013", "decision": "What elements must every voice signal contain, and in what order?", "locator": "29 CFR 1926.1421(b)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "truckIn", "role": "truck driver (Truck 12)", "keys": ["truck", "driver"], "call": "Truck 12", "title": "Bring the truck to the mark", "timed": null, "situation": "You are driving Truck 12 through the west gate. The signal person is ahead of you on your left. A laborer standing by the gate is also waving you forward.", "question": "Whose directions do you follow as you pull in?", "lateBanner": null, "lateText": null, "lesson": "Follow one designated signal person, and stop if you lose sight of them.", "options": [{"correct": true, "text": "Only the designated signal person. Keep them in view through the windshield and left window, and stop if you lose sight of them.", "why": "One voice and one set of hands. If you can’t see your signal person, you stop. Following them also lands the girder on the mark, so the crane lifts at the planned radius."}, {"text": "Whoever is waving. The laborer by the gate is closer to your cab, and more eyes on a big truck are safer.", "why": "Two people directing one truck means conflicting signals. The laborer can’t see the pick mark or the crane’s radius. Follow the designated signal person only.", "risk": 15, "lost": 40, "banner": "Two people giving one truck directions"}, {"text": "Ignore the hand signals and creep forward until the painted mark looks lined up with the trailer from the cab.", "why": "From the cab you can’t judge the mark precisely. A few feet past it adds radius, and a crane’s capacity drops as radius grows.", "risk": 10, "lost": 60, "banner": "Truck stopped off the mark"}], "evidence": {"site_practice": true, "note": "No rule says whose directions a delivery driver follows; one designated signal person is this site's traffic plan.", "teaches": [], "context": [{"atom_id": "ATM-S2-018", "decision": "What plan covers vehicles and equipment inside the work space?", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Overview of ITCPs'", "force": "example practice"}, {"atom_id": "ATM-S4-017", "decision": "Who must know the ITCP, and when?", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Communicating an ITCP'", "force": "should"}], "conflicts": [], "videos": []}}, {"id": "driverOut", "role": "truck driver (Truck 12)", "keys": ["truck", "driver"], "call": "Truck 12", "title": "Where the driver waits", "timed": null, "situation": "You are stopped on the mark. The rigger is about to climb onto your trailer to hook up the girder, and then the crane will lift it off and swing it away.", "question": "What do you do now?", "lateBanner": null, "lateText": null, "lesson": "Brakes set, engine off, driver in the safe zone until released by name.", "options": [{"correct": true, "text": "Set the brakes, shut down, tell Signal you’re out, then walk to the green safe zone and wait to be released.", "why": "A parked, shut-down truck can’t roll and drag a rigged load. In the safe zone you are outside the fall zone and in the signal person’s view, so they always know where you are."}, {"text": "Climb onto the trailer and help the rigger hook the slings to the girder, so the load comes off sooner and you can leave.", "why": "Only the rigger should be on the deck. A second person on a loaded trailer is one more person in the crush zone if the girder shifts as it lifts.", "risk": 20, "lost": 30, "banner": "Two people on a loaded trailer"}, {"text": "Stay in the cab with the engine running and the brakes set, ready to pull out the moment the girder is off the deck.", "why": "If the truck moves while the girder is rigged, it drags the load and side-loads the crane. Shut down and leave the cab until the hook is clear.", "risk": 20, "lost": 45, "banner": "Truck could move with the load rigged"}], "evidence": {"site_practice": false, "note": "Whether the driver may stay in a cab with a cab shield is open (CNF-004). The scenario's lift plan sends the driver to a safe zone.", "teaches": [{"atom_id": "ATM-S1-016", "decision": "Who may be in the fall zone, and under what conditions?", "correct_action": "Keep everyone out of the fall zone except employees hooking, unhooking or guiding the load, making the initial attachment to a component or structure, or operating a concrete hopper/bucket. When employees are hooking/unhooking/guiding or making the initial connection inside the fall zone: the materials are rigged to prevent unintentional displacement, hooks with self-closing latches (or equivalent) are used, and the materials are rigged by a qualified rigger.", "force": "must", "locator": "29 CFR 1926.1425(b)-(c)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1425(b)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "While the operator is not moving a suspended load, no employee must be within the fall zone, except for employees:", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The materials being hoisted must be rigged to prevent unintentional displacement.", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(2)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Hooks with self-closing latches or their equivalent must be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(3)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The materials must be rigged by a qualified rigger.", "verified": "PASS"}, {"citation": "29 CFR 1926.1401 “Fall zone”", "url": "https://www.ecfr.gov/current/title-29/section-1926.1401", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Fall zone means the area (including but not limited to the area directly beneath the load) in which it is reasonably foreseeable that partially or completely suspended materials could fall in the event of an accident.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-018", "decision": "What protection must the haulage vehicle have, and may the driver stay in the cab?", "locator": "29 CFR 1926.601(b)(6)", "force": "must"}], "conflicts": [{"id": "CNF-004", "title": "May a truck driver remain in the cab while a crane loads or unloads the truck?", "status": "OPEN", "implication": "The trainer could teach either 'stay in a shielded cab' or 'leave the fall zone' for crane loading; the texts do not settle it.", "handling": "Keep the S1 atom flagged. OSHA's 2001-02-28 letter confirms §1926.601(b)(6) applies to haulage vehicles loaded by cranes, power shovels, loaders etc. and that a cab shield protects against 'material falling from a loader bucket passing near or over the cab' — it does not address crane fall-zone rules (letter verified live 2026-10-07). No letter found on cab occupancy under Subpart CC. Until resolved, design S1 scenarios so the driver is outside the fall zone, and present the cab-shield rule only for excavator loading (S2).", "decision_by": "PI / safety SME"}], "videos": []}}, {"id": "testLift", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Test the load", "timed": null, "situation": "The rigger is off the trailer and holding the tag line. This lift plan calls for a controlled 6-inch (0.1524 m) test lift before travel so the crew can verify balance and control. Six inches is a scenario/lift-plan value, not a universal OSHA test-lift height.", "question": "Which signal do you give?", "lateBanner": null, "lateText": null, "lesson": "For this lift plan, hoist slowly to the modeled 6-inch check height, stop, and verify balance/control before continuing; the exact check height comes from the lift plan/manufacturer procedure, not a universal OSHA number.", "options": [{"correct": true, "signal": "hoistSlow", "text": "Give the hoist signal with your other hand held in front of it, so the girder comes up slowly, then stop at check height.", "why": "This uses OSHA’s Standard Method combination for MOVE SLOWLY. The scenario then stops at the lift-plan’s 6-inch check height to verify balance/control while the load remains over the trailer."}, {"signal": "swing", "text": "Point toward the landing so the girder clears the deck as it swings, which saves a separate lift-and-stop.", "why": "Swinging before the load is clear of the deck and tested can snag it on the trailer and side-load the boom.", "risk": 20, "lost": 60, "banner": "Swing before the load is clear and tested"}, {"signal": "raiseBoom", "text": "Arm out, thumb up, so booming up lifts the girder off the deck without touching the hoist line.", "why": "Booming up with the girder still on the deck drags it toward the crane. Lift straight up first.", "risk": 15, "lost": 45, "banner": "Load dragged across the deck"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-003", "decision": "Which hand signals may be used, and what must happen before any non-standard signal is used?", "correct_action": "Use the Standard Method hand signals (Appendix A to Subpart CC). Use non-standard hand signals only where the Standard Method is infeasible or the operation/attachment is not covered, and only after the signal person, operator, and lift director (where there is one) contact each other before the operation and agree on them.", "force": "must", "locator": "29 CFR 1926.1419(c)(1)-(2)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using hand signals, the Standard Method must be used (see appendix A of this subpart).", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Where use of the Standard Method for hand signals is infeasible, or where an operation or use of an attachment is not covered in the Standard Method, non-standard hand signals may be used in accordance with paragraph (c)(2) of this section.", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(2)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using non-standard hand signals, the signal person, operator, and lift director (where there is one) must contact each other prior to the operation and agree on the non-standard hand signals that will be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1422[unlabeled-1]", "url": "https://www.ecfr.gov/current/title-29/section-1926.1422", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Hand signal charts must be either posted on the equipment or conspicuously posted in the vicinity of the hoisting operations.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-013", "decision": "What elements must every voice signal contain, and in what order?", "locator": "29 CFR 1926.1421(b)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "walkIn", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Someone walks into the swing path", "timed": 9, "situation": "You are about to call the hoist to travel height. An ironworker walks out from under the bridge, head down on a phone, straight toward the load’s swing path. The walkway tape is down.", "question": "What do you signal, right now?", "lateBanner": "Too slow: the ironworker is in the swing path", "lateText": "The ironworker is now standing where the load is about to swing. Stop calls have to be instant.", "lesson": "Someone in the path: emergency stop first, then clear the area.", "options": [{"correct": true, "signal": "estop", "text": "Both arms out, palms down, sweeping, and “all stop” on the radio.", "why": "Stop first, sort it out second. The operator obeys an emergency stop from anyone, and nothing moves until the path is clear again."}, {"text": "Keep the lift going. The crane is loud, so the ironworker will hear it and look up in time.", "why": "Never assume someone has seen a suspended load. The operator often can’t see the ground where the load is heading.", "risk": 25, "lost": 0, "banner": "Load moving toward someone who hasn’t seen it"}, {"signal": "lower", "text": "Set the girder back down on the trailer as quickly as you can, so it is no longer over anyone.", "why": "A rushed move is still a move, and the ironworker is still walking. Stop all motion, then decide.", "risk": 15, "lost": 30, "banner": "A rushed move is still a move"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-004", "decision": "How are STOP and EMERGENCY STOP given and recognized under the Standard Method?", "correct_action": "Give/recognize STOP as 'arm extended horizontally to the side, palm down, arm is swung back and forth' and EMERGENCY STOP as 'both arms extended horizontally to the side, palms down, arms are swung back and forth' (Appendix A).", "force": "must", "locator": "29 CFR 1926 Subpart CC, Appendix A, figure ER09AU10.003, panels 1–2 (STOP; EMERGENCY STOP)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": true, "review_reasons": ["Signal wording transcribed manually from the official figure image; compare to sources/raw/ecfr/AppA_SubpartCC_ER09AU10.003.png.", "Pending: RIN 1218-AC81 NPRM (timetabled 11/2026) would 'correct an error in a caption on standard hand signals' — which caption is not stated (CNF-010)."], "quotes": [{"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using hand signals, the Standard Method must be used (see appendix A of this subpart).", "verified": "PASS"}, {"citation": "29 CFR 1926 Subpart CC, Appendix A, figure ER09AU10.003, panel 1 (STOP)", "url": "https://www.ecfr.gov/current/title-29/part-1926/subpart-CC", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "With arm extended horizontally to the side, palm down, arm is swung back and forth.", "verified": "PASS"}, {"citation": "29 CFR 1926 Subpart CC, Appendix A, figure ER09AU10.003, panel 2 (EMERGENCY STOP)", "url": "https://www.ecfr.gov/current/title-29/part-1926/subpart-CC", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "With both arms extended horizontally to the side, palms down, arms are swung back and forth.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-005", "decision": "What must a worker who is not the designated signal person do on noticing a safety problem?", "correct_action": "Alert the operator or signal person by giving the stop or emergency stop signal.", "force": "must", "locator": "29 CFR 1926.1419(j)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1419(j)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Anyone who becomes aware of a safety problem must alert the operator or signal person by giving the stop or emergency stop signal.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-016", "decision": "Who may be in the fall zone, and under what conditions?", "correct_action": "Keep everyone out of the fall zone except employees hooking, unhooking or guiding the load, making the initial attachment to a component or structure, or operating a concrete hopper/bucket. When employees are hooking/unhooking/guiding or making the initial connection inside the fall zone: the materials are rigged to prevent unintentional displacement, hooks with self-closing latches (or equivalent) are used, and the materials are rigged by a qualified rigger.", "force": "must", "locator": "29 CFR 1926.1425(b)-(c)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1425(b)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "While the operator is not moving a suspended load, no employee must be within the fall zone, except for employees:", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The materials being hoisted must be rigged to prevent unintentional displacement.", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(2)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Hooks with self-closing latches or their equivalent must be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1425(c)(3)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1425", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The materials must be rigged by a qualified rigger.", "verified": "PASS"}, {"citation": "29 CFR 1926.1401 “Fall zone”", "url": "https://www.ecfr.gov/current/title-29/section-1926.1401", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Fall zone means the area (including but not limited to the area directly beneath the load) in which it is reasonably foreseeable that partially or completely suspended materials could fall in the event of an accident.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-014", "decision": "How must the swing-radius hazard area be controlled?", "locator": "29 CFR 1926.1424(a)(1)-(2)", "force": "must"}, {"atom_id": "ATM-S1-015", "decision": "What must happen before the worker enters, and before the operator rotates again?", "locator": "29 CFR 1926.1424(a)(3)(i)-(ii)", "force": "must"}], "conflicts": [], "videos": [{"segment_id": "VID-nZqNvyqkhXA-SEG-02", "title": "Struck-by Accidents in Construction/Swinging Cranes", "channel": "USDepartmentofLabor", "url": "https://www.youtube.com/watch?v=nZqNvyqkhXA&t=55s", "start": "00:55", "end": "01:50", "label": "bad example", "summary": "A driver delivers steel beams on a flatbed. A hydraulic crane offloads it. The area is 'secured' only by vehicles and two attendants; the swing radius is not barricaded, and the driver is allowed to stay because he knows the operator.", "timing": "approximate (±8 s)", "transcript_url": "https://www.osha.gov/vtools/construction/struck-by-crane-fnl-eng-web-transcript", "review_status": "PENDING_PI_REVIEW", "flags": []}, {"segment_id": "VID-nZqNvyqkhXA-SEG-03", "title": "Struck-by Accidents in Construction/Swinging Cranes", "channel": "USDepartmentofLabor", "url": "https://www.youtube.com/watch?v=nZqNvyqkhXA&t=110s", "start": "01:50", "end": "02:20", "label": "bad example", "summary": "Before unloading starts, the driver moves within the swing radius, out of the operator's line of sight; the operator begins positioning the crane, and the driver is crushed between the counterweight and the right rear outrigger. Narration then names the missing controls.", "timing": "approximate (±8 s)", "transcript_url": "https://www.osha.gov/vtools/construction/struck-by-crane-fnl-eng-web-transcript", "review_status": "PENDING_PI_REVIEW", "flags": ["Reenactment of a real incident; disturbing content warning shown in video."]}, {"segment_id": "VID-nZqNvyqkhXA-SEG-04", "title": "Struck-by Accidents in Construction/Swinging Cranes", "channel": "USDepartmentofLabor", "url": "https://www.youtube.com/watch?v=nZqNvyqkhXA&t=140s", "start": "02:20", "end": "03:10", "label": "good example", "summary": "Corrected scene: a temporary barricade with caution tape keeps workers out of the swing radius; narration says employers should make sure crane/superstructure movement occurs only when an 'all clear' signal is given; the crane moves with no one inside the radius.", "timing": "approximate (±8 s)", "transcript_url": "https://www.osha.gov/vtools/construction/struck-by-crane-fnl-eng-web-transcript", "review_status": "PENDING_PI_REVIEW", "flags": ["'All clear before every movement' is broader than the CFR text, which requires prearranged confirmation before rotating when the operator knows an employee went into an out-of-view hazard location (§1926.1424(a)(3)(ii)); present it as recommended practice, not a CFR requirement.", "Narration specifies 3-inch caution tape; the CFR requires 'control lines, warning lines, railings or similar barriers' and sets no tape width."]}]}}, {"id": "twoVoices", "role": "crane operator", "keys": ["operator"], "call": "Crane 1", "title": "Two voices on the channel", "timed": null, "situation": "You are the crane operator now. Signal calls a hoist. A second later, a voice you don’t recognize cuts in on the channel. Read the radio log.", "question": "What do you do?", "lateBanner": null, "lateText": null, "lesson": "Take moving calls from one designated signal person; obey a stop from anyone.", "options": [{"correct": true, "text": "Hold everything and ask Signal to confirm the call. Moving calls come only from the designated signal person.", "why": "Conflicting calls mean somebody is wrong. Holding costs seconds; guessing could swing the load into someone. The one exception is an emergency stop, which you obey from anyone."}, {"text": "Follow the most recent call. It sounded urgent, and the newest call on the channel usually reflects what is happening now.", "why": "Urgency isn’t authority. Only the designated signal person directs the lift, except for stop calls.", "risk": 25, "lost": 0, "banner": "Swing started on a stranger’s call"}, {"text": "Do both at once: finish the hoist and start the swing, so the load clears whatever made someone call it.", "why": "Combining motions on an unconfirmed call is how loads hit structures. One confirmed function at a time.", "risk": 20, "lost": 0, "banner": "Two motions on an unconfirmed call"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-009", "decision": "Who may give signals to the crane?", "correct_action": "Only one person gives signals to the crane at a time (the designated signal person); everyone else limits themselves to the stop/emergency stop signal.", "force": "must", "locator": "29 CFR 1926.1419(h)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": true, "review_reasons": ["Operator response to conflicting signals is inferred from §1926.1419(g); the text of (h) states only the one-signaler rule."], "quotes": [{"citation": "29 CFR 1926.1419(h)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Only one person may give signals to a crane/derrick at a time, except in circumstances covered by paragraph (j) of this section.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-006", "decision": "Must the operator obey a stop signal from someone who is not the designated signal person?", "correct_action": "Obey the stop (or emergency stop) signal, irrespective of who gives it.", "force": "must", "locator": "29 CFR 1926.1417(y)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1417(y)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1417", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The operator must obey a stop (or emergency stop) signal, irrespective of who gives it.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-011", "decision": "What must be in place before and during radio signaling?", "locator": "29 CFR 1926.1420(a)-(c)", "force": "must"}, {"atom_id": "ATM-S1-008", "decision": "What must the operator do before communicating about the problem, and when may operations resume?", "locator": "29 CFR 1926.1419(g)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "swing", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Swing to the landing", "timed": null, "situation": "The girder is at travel height, well clear of the trailer. The landing dunnage is about 90° to the operator’s left. The rigger will walk the tag line outside the fall zone.", "question": "Which signal moves the load toward the landing?", "lateBanner": null, "lateText": null, "lesson": "Swing: point the direction, count the distance down, finish with \"swing stop.\"", "options": [{"correct": true, "signal": "swing", "text": "Arm extended, index finger pointing in the direction the boom should swing.", "why": "The modeled move is exactly 90°. Use the standard SWING hand signal and a complete voice signal that states the function/direction, angular travel, and stop command."}, {"signal": "travel", "text": "Arm out with fingers up, pushing toward the landing in the direction you want the load to go.", "why": "Travel moves the whole crane. This crane is set up on outriggers and does not travel with a load.", "risk": 20, "lost": 60, "banner": "Travel called on a crane set on outriggers"}, {"signal": "lowerBoom", "text": "Arm out, fingers closed, thumb pointing down toward the ground.", "why": "Booming down with a load on the hook adds radius and cuts capacity. It also moves the load outward, not around.", "risk": 20, "lost": 45, "banner": "Radius growing with the load in the air"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-003", "decision": "Which hand signals may be used, and what must happen before any non-standard signal is used?", "correct_action": "Use the Standard Method hand signals (Appendix A to Subpart CC). Use non-standard hand signals only where the Standard Method is infeasible or the operation/attachment is not covered, and only after the signal person, operator, and lift director (where there is one) contact each other before the operation and agree on them.", "force": "must", "locator": "29 CFR 1926.1419(c)(1)-(2)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using hand signals, the Standard Method must be used (see appendix A of this subpart).", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Where use of the Standard Method for hand signals is infeasible, or where an operation or use of an attachment is not covered in the Standard Method, non-standard hand signals may be used in accordance with paragraph (c)(2) of this section.", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(2)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using non-standard hand signals, the signal person, operator, and lift director (where there is one) must contact each other prior to the operation and agree on the non-standard hand signals that will be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1422[unlabeled-1]", "url": "https://www.ecfr.gov/current/title-29/section-1926.1422", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Hand signal charts must be either posted on the equipment or conspicuously posted in the vicinity of the hoisting operations.", "verified": "PASS"}]}, {"atom_id": "ATM-S1-013", "decision": "What elements must every voice signal contain, and in what order?", "correct_action": "Each voice signal contains, in this order: function (such as hoist, boom), direction; distance and/or speed; function, stop command.", "force": "must", "locator": "29 CFR 1926.1421(b)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1421(b)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1421", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Each voice signal must contain the following three elements, given in the following order: function (such as hoist, boom, etc.), direction; distance and/or speed; function, stop command.", "verified": "PASS"}, {"citation": "29 CFR 1926.1421(c)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1421", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The operator, signal person and lift director (if there is one), must be able to effectively communicate in the language used.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-010", "decision": "From whose perspective must directions be given?", "locator": "29 CFR 1926.1419(k)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "radioDrop", "role": "crane operator", "keys": ["operator"], "call": "Crane 1", "title": "The radio goes quiet", "timed": null, "situation": "You are the operator, lowering toward dunnage you cannot see from the cab. Signal is counting you down. Mid-count, the radio goes silent.", "question": "What do you do?", "lateBanner": null, "lateText": null, "lesson": "Lost communication means stop and hold until it is re-established.", "options": [{"correct": true, "text": "Stop all motion and hold the load where it is until communication is back.", "why": "No signal means no motion. OSHA’s crane rules require the operator to safely stop operations that depend on signals when communication is interrupted, until it is re-established."}, {"text": "Keep lowering slowly. You know roughly where the dunnage is, and the last call was for 15 feet.", "why": "Roughly isn’t good enough for a load you can’t see. Someone could have walked under it while the radio was down.", "risk": 25, "lost": 0, "banner": "Blind lowering with no signal"}, {"text": "Lower a bit faster to get the girder onto the dunnage before anything else goes wrong.", "why": "Speeding up a move you can’t see multiplies the risk. Stop and wait for contact.", "risk": 25, "lost": 0, "banner": "Speeding up a blind move"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-007", "decision": "Continue the motion or stop?", "correct_action": "Safely stop operations requiring signals until the ability to transmit signals is reestablished and a proper signal is given and understood.", "force": "must", "locator": "29 CFR 1926.1419(f)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1419(f)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "During operations requiring signals, the ability to transmit signals between the operator and signal person must be maintained. If that ability is interrupted at any time, the operator must safely stop operations requiring signals until it is reestablished and a proper signal is given and understood.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-008", "decision": "What must the operator do before communicating about the problem, and when may operations resume?", "locator": "29 CFR 1926.1419(g)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "release", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Release the truck", "timed": null, "situation": "The girder is on the dunnage and the rigger is about to unhook. Truck 12’s driver is in the safe zone, waiting to leave.", "question": "When does Truck 12 get to move?", "lateBanner": null, "lateText": null, "lesson": "Release equipment by name, after the hook is clear.", "options": [{"correct": true, "text": "Once the slings are off and the hook is hoisted clear, radio Truck 12 by name that it is clear to leave.", "why": "Equipment moves on a clear call by name, never on silence. A hook left hanging at head height can still catch the driver or the truck."}, {"text": "As soon as the girder touches the dunnage, since the truck is no longer part of the lift.", "why": "The hook and slings are still moving near the truck. Release the truck once the hook is clear.", "risk": 15, "lost": 20, "banner": "Driver walking under a free hook"}, {"text": "When the driver sees from the safe zone that the crane and the rigger have stopped moving.", "why": "Silence isn’t a signal, and people read a still crane differently. Say it on the radio, by name.", "risk": 10, "lost": 40, "banner": "Silence taken as a signal"}], "evidence": {"site_practice": true, "note": "Releasing the truck by name is a closed-loop practice; the rules cover who may be in the fall zone.", "teaches": [], "context": [{"atom_id": "ATM-S1-017", "decision": "Who may be in the fall zone while the load is landed?", "locator": "29 CFR 1926.1425(d)", "force": "must"}, {"atom_id": "ATM-S1-016", "decision": "Who may be in the fall zone, and under what conditions?", "locator": "29 CFR 1926.1425(b)-(c)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "dog", "role": "signal person", "keys": ["signal"], "call": "Signal", "title": "Close out the lift", "timed": null, "situation": "Truck 12 is out the gate and the hook is parked high. The operator is waiting on your last call.", "question": "How do you close out the lift?", "lateBanner": null, "lateText": null, "lesson": "Close every lift with a clear call so nobody is left guessing.", "options": [{"correct": true, "signal": "dog", "text": "Hands clasped in front of you, and “lift complete, dog everything” on the radio.", "why": "It tells the operator to pause and secure every motion. Ending the lift out loud closes the loop for the whole crew."}, {"text": "Walk off to the next task. The operator watched the girder land and knows the lift is done.", "why": "An open loop leaves the operator wondering whether more calls are coming. Close the lift with a clear call.", "risk": 10, "lost": 30, "banner": "Operator left guessing"}, {"signal": "travel", "text": "Push your hand toward the parking spot so the operator can move the crane.", "why": "The crane is still on outriggers. Close the lift first; moving the crane is a separate, planned step.", "risk": 15, "lost": 45, "banner": "Travel called with outriggers down"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S1-003", "decision": "Which hand signals may be used, and what must happen before any non-standard signal is used?", "correct_action": "Use the Standard Method hand signals (Appendix A to Subpart CC). Use non-standard hand signals only where the Standard Method is infeasible or the operation/attachment is not covered, and only after the signal person, operator, and lift director (where there is one) contact each other before the operation and agree on them.", "force": "must", "locator": "29 CFR 1926.1419(c)(1)-(2)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using hand signals, the Standard Method must be used (see appendix A of this subpart).", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(1)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Where use of the Standard Method for hand signals is infeasible, or where an operation or use of an attachment is not covered in the Standard Method, non-standard hand signals may be used in accordance with paragraph (c)(2) of this section.", "verified": "PASS"}, {"citation": "29 CFR 1926.1419(c)(2)", "url": "https://www.ecfr.gov/current/title-29/section-1926.1419", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "When using non-standard hand signals, the signal person, operator, and lift director (where there is one) must contact each other prior to the operation and agree on the non-standard hand signals that will be used.", "verified": "PASS"}, {"citation": "29 CFR 1926.1422[unlabeled-1]", "url": "https://www.ecfr.gov/current/title-29/section-1926.1422", "source": "29 CFR Part 1926 Subpart CC — Cranes and Derricks in Construction (§§1926.1400, 1401, 1417–1422, 1424, 1425, 1428; Appendix A)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Hand signal charts must be either posted on the equipment or conspicuously posted in the vicinity of the hoisting operations.", "verified": "PASS"}]}], "context": [], "conflicts": [], "videos": []}}]}, "exc": {"key": "exc", "title": "Loading out the widening cut", "sub": "Excavator, two dump trucks, spotter and grade checker", "channel": "Channel 2", "camLabels": {"operator": "Excavator cab", "driver": "Truck cab", "signal": "Spotter"}, "briefKeys": ["spotter"], "briefCall": "Spotter", "briefing": "\n    <p>This highway job is widening the road by two lanes. The excavator is digging out the cut for the new lanes and loading dump trucks that haul the material to the fill section. Trucks come in on the haul road, wait at the staging cone, back into the loading lane, and get {{DUMP.PASSES}} passes each. The excavator swings about 70° from the cut to the truck’s tailgate. Live highway traffic runs just past the north fence.</p>\n    <h3>Weights used in this model</h3>\n    <table class=\"pdata\">\n      <tr><td>Bucket<small>20-t class excavator, heaped capacity (ISO 7451)</small></td><td>{{BUCKET.M3}} m³ (1.56 yd³)</td></tr>\n      <tr><td>Material<small>Clay, natural bed: {{SOIL.BANK.toLocaleString('en-US')}} kg/m³ in the bank, {{SOIL.LOOSE.toLocaleString('en-US')}} kg/m³ once dug and loose (Caterpillar earthwork tables)</small></td><td>{{SOIL.LOOSE.toLocaleString('en-US')}} kg/m³</td></tr>\n      <tr><td><b>Each pass</b><small>{{BUCKET.M3}} m³ × fill factor {{BUCKET.FILL.toFixed(1)}} × {{SOIL.LOOSE.toLocaleString('en-US')}} kg/m³</small></td><td>{{fmtLb(BUCKET.PASS_KG)}}</td></tr>\n      <tr><td>Dump truck, empty<small>Tandem axle, 16 yd³ body</small></td><td>{{fmtLb(DUMP.EMPTY_KG)}}</td></tr>\n      <tr><td>Legal gross weight<small>20,000 lb steer axle + 34,000 lb tandem (federal axle limits; state rules vary)</small></td><td>{{fmtLb(DUMP.GVW_KG)}}</td></tr>\n      <tr><td><b>Passes per truck</b><small>{{DUMP.PASSES}} × {{fmtLb(BUCKET.PASS_KG)}} = {{fmtLb(DUMP.PASSES * BUCKET.PASS_KG)}}, inside the {{fmtLb(DUMP.PAYLOAD_KG)}} payload. Clay is heavy: the truck reaches its weight limit with the bed only about {{Math.round(DUMP.PASSES * BUCKET.M3 * BUCKET.FILL / DUMP.BED_M3 * 100)}}% full.</small></td><td>{{DUMP.PASSES}}</td></tr>\n    </table>\n    <h3>Crew</h3>\n    <dl class=\"crew\">\n      <dt>Excavator</dt><dd>Excavator operator</dd>\n      <dt class=\"me\">Spotter</dt><dd>Guides trucks in and watches the ground. You play this role most of the time.</dd>\n      <dt>Truck 7</dt><dd>First dump truck</dd>\n      <dt>Truck 9</dt><dd>Next dump truck</dd>\n      <dt>Grade checker</dt><dd>Checking grade with a GPS rover pole, not part of loading</dd>\n    </dl>\n    <p style=\"margin-top:8px\">In some steps you’ll switch seats and play the excavator operator or a truck driver.</p>\n    <h3>Agreed at the toolbox talk</h3>\n    <ul class=\"rules\">\n      <li>Channel 2 for loading.</li>\n      <li>Excavator horn: three short means back in, two short means loaded and pull out, one long means stop. Horn codes vary from site to site, so these are this crew’s.</li>\n      <li><b>Site loading rule:</b> trucks back in on the designated spotter side and the excavator loads over the tailgate/bed, not over the occupied cab. OSHA 1926.651(e) separately requires employees to stay clear of loads and permits a protected operator to remain in a compliant cab.</li>\n      <li>Nobody enters the swing radius unless the operator has acknowledged them and grounded the bucket.</li>\n    </ul>\n    <h3>On the ground</h3>\n    <ul class=\"rules\">\n      <li><span class=\"zkey\" style=\"background:#d8261c\"></span>Red: swing radius, and the counterweight’s tail area that turns with the machine</li>\n      <li><span class=\"zkey\" style=\"background:#ffc61a\"></span>Yellow: the loading lane trucks back into</li>\n    </ul>", "scenario_family": "S2_EXCAVATOR_TRUCK", "conflicts": [{"id": "CNF-005", "title": "Are hydraulic excavators 'earthmoving equipment' under §1926.602(a)?", "status": "ANSWERED BY OSHA INTERPRETATION — pending PI acceptance", "implication": "Reverse-alarm/observer requirement for excavators may be stated with more certainty than the text supports.", "handling": "OSHA interpretations answer the question: 1995-05-10 ('The scope of paragraph 1926.602(a) does not include track mounted excavators with rotating housings…') and 2006-05-09 ('excavators are covered by §1926.602(b) rather than by §1926.602(a)'); the 1995 letter treats reversing an excavator with obstructed view without alarm/observer as a recognized hazard citable under OSH Act §5(a)(1). ATM-S2-002 was narrowed accordingly and ATM-S2-014 added. Quotes verified on the live osha.gov pages 2026-10-07.", "decision_by": "PI (accept interpretation-based atoms?)"}], "steps": [{"id": "toolbox", "role": "spotter", "keys": ["spotter"], "call": "Spotter", "title": "Agree on the signals", "timed": null, "situation": "Start of shift at the cut. Truck 7 is on its way in and Truck 9 is a few minutes behind. The operator can’t see behind the trucks, and the drivers can’t see the bucket.", "question": "What does the crew settle before the first truck backs in?", "lateBanner": null, "lateText": null, "lesson": "Agree on the channel, horn codes, approach, loading side and spotter position before the first truck.", "options":
