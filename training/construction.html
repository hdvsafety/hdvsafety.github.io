[{"correct": true, "text": "Radio channel, horn codes, where trucks wait and back in, which side gets loaded, and where you stand.", "why": "Each item removes a guess. Horn codes still work when the radio is noisy, and an agreed loading side keeps the bucket away from the cab."}, {"text": "Just the number of loads for the shift. The operator and both drivers have run this cut together for weeks.", "why": "Experience doesn’t replace an agreement. Every site, crew and truck mix is different, and horn codes are not universal.", "risk": 15, "lost": 60, "banner": "Experienced crew, no agreement"}, {"text": "Nothing formal. The operator waves each truck in with the bucket when ready, as on most excavation jobs.", "why": "Waving a bucket is ambiguous and puts it in motion over people and cabs. Use the horn, radio and hand signals the crew agreed on.", "risk": 20, "lost": 45, "banner": "Bucket used as a signal"}], "evidence": {"site_practice": false, "note": "Subpart CC's signal rules do not apply to excavators (ATM-S2-013), so horn codes and hand signals are the crew's own agreement.", "teaches": [{"atom_id": "ATM-S4-017", "decision": "Who must know the ITCP, and when?", "correct_action": "Communicate the ITCP to all employees at the worksite, including construction vehicle drivers entering the site, before work begins and whenever the plan is updated (e.g., pre-shift huddles; briefing arriving drivers).", "force": "should", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Communicating an ITCP'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #5", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "Once the ITCP is developed, it must be communicated to all employees at the worksite including construction vehicle drivers entering the worksite.", "verified": "PASS"}, {"citation": "part #5", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "Communication should occur before work begins and anytime the ITCP is updated.", "verified": "PASS"}, {"citation": "text page 1 #1", "url": "https://workzonesafety.org/files/documents/training/courses_programs/rsa_program/RSP_Guidance_Documents_Download/RSP_ITCP_Guidance_Download-508.pdf", "source": "Guidance: Developing Internal Traffic Control Plans (ITCPs) for Work Zones", "authority": "B", "status": "CURRENT", "page": null, "quote": "or by the U.S. Department of Labor, Occupational Safety and Health Administration (OSHA), adoption of an ITCP approach is an effective method of organizing the work space to reduce work zone injuries and fatalities.", "verified": "PASS"}]}, {"atom_id": "ATM-S2-018", "decision": "What plan covers vehicles and equipment inside the work space?", "correct_action": "Use an internal traffic control plan to coordinate and control the flow of construction vehicles, equipment and workers within the work zone, separating vehicles and equipment from workers on foot to the extent possible.", "force": "example practice", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Overview of ITCPs'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #2", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "temporary traffic control plans do not address construction equipment and vehicles within the workspace – these types of hazards are addressed in an ITCP.", "verified": "PASS"}, {"citation": "part #3", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "The purpose of an ITCP is to separate—to the extent possible—vehicles and equipment from on-foot workers and to prevent struck by incidents.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S2-013", "decision": "Does the crane standard (Subpart CC, incl. its signaling rules) apply to this lift?", "locator": "29 CFR 1926.1400(c)(2)", "force": "explains"}, {"atom_id": "ATM-S2-003", "decision": "What audible warning must the machine have and use?", "locator": "29 CFR 1926.602(a)(9)(i)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "arrive", "role": "truck driver (Truck 7)", "keys": ["t7"], "call": "Truck 7", "title": "Arriving at the cut", "timed": null, "situation": "You are driving Truck 7 back from the fill section into the loading area. The excavator is digging with its bucket swinging, and the operator hasn’t signaled you yet.", "question": "What do you do?", "lateBanner": null, "lateText": null, "lesson": "Wait at the staging point for the operator’s call.", "options": [{"correct": true, "text": "Pull up to the staging cone, stop outside the swing radius, and wait for three short blasts before backing in.", "why": "The staging cone keeps you outside the swing radius until the operator is ready for you. A few seconds of waiting beats backing into a swinging bucket."}, {"text": "Start backing in now. The operator faces the loading lane and will see you coming.", "why": "Operators watch the bucket and the dig. A truck backing in unannounced lands in their blind side.", "risk": 25, "lost": 30, "banner": "Truck backing into a swinging bucket"}, {"text": "Give a couple of blasts on your own horn so the operator knows you have arrived.", "why": "Horn blasts mean specific things on this site. Extra honking muddies the code everyone agreed on.", "risk": 5, "lost": 30, "banner": "Horn code muddied"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S2-018", "decision": "What plan covers vehicles and equipment inside the work space?", "correct_action": "Use an internal traffic control plan to coordinate and control the flow of construction vehicles, equipment and workers within the work zone, separating vehicles and equipment from workers on foot to the extent possible.", "force": "example practice", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Overview of ITCPs'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #2", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "temporary traffic control plans do not address construction equipment and vehicles within the workspace – these types of hazards are addressed in an ITCP.", "verified": "PASS"}, {"citation": "part #3", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "The purpose of an ITCP is to separate—to the extent possible—vehicles and equipment from on-foot workers and to prevent struck by incidents.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S2-004", "decision": "May the operator swing or hold the loaded bucket over the worker?", "locator": "29 CFR 1926.651(e)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "spot", "role": "spotter", "keys": ["spotter"], "call": "Spotter", "title": "Spot the backing truck", "timed": null, "situation": "Truck 7 is about to back toward the excavator. The driver can’t see directly behind the truck.", "question": "Where do you stand to guide it?", "lateBanner": null, "lateText": null, "lesson": "Spot from the driver’s side, in the mirror, out of the path and outside the swing radius.", "options": [{"correct": true, "text": "On the driver’s side, out of the truck’s path and outside the swing radius, where the driver sees you in the left mirror.", "why": "The driver can see you, you are out of the truck’s path and out of the bucket’s reach. If you can’t see the driver’s face in the mirror, the driver can’t see you."}, {"text": "Directly behind the truck, where you can see exactly where the tailgate needs to stop and call the distance to the inch.", "why": "Behind a backing truck is the classic struck-by position. Stand off to the side, in the mirror.", "risk": 25, "lost": 0, "banner": "Spotter standing in the backing path"}, {"text": "Between the truck and the excavator, where the driver and the operator can both see you and your hand signals at the same time.", "why": "That is the pinch point between two machines and inside the swing radius. Stay on the outside.", "risk": 25, "lost": 0, "banner": "Spotter in the pinch point"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S2-001", "decision": "Under what conditions may the truck back up?", "correct_action": "Back up only if the vehicle has a reverse signal alarm audible above the surrounding noise level, or only when an observer signals that it is safe to do so.", "force": "must", "locator": "29 CFR 1926.601(b)(4)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.601(b)(4)", "url": "https://www.ecfr.gov/current/title-29/section-1926.601", "source": "29 CFR 1926.600–1926.602 — Equipment; Motor vehicles; Material handling equipment (Part 1926, Subpart O)", "authority": "A", "status": "CURRENT", "page": null, "quote": "No employer shall use any motor vehicle equipment having an obstructed view to the rear unless:", "verified": "PASS"}, {"citation": "29 CFR 1926.601(b)(4)(i)", "url": "https://www.ecfr.gov/current/title-29/section-1926.601", "source": "29 CFR 1926.600–1926.602 — Equipment; Motor vehicles; Material handling equipment (Part 1926, Subpart O)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The vehicle has a reverse signal alarm audible above the surrounding noise level or:", "verified": "PASS"}, {"citation": "29 CFR 1926.601(b)(4)(ii)", "url": "https://www.ecfr.gov/current/title-29/section-1926.601", "source": "29 CFR 1926.600–1926.602 — Equipment; Motor vehicles; Material handling equipment (Part 1926, Subpart O)", "authority": "A", "status": "CURRENT", "page": null, "quote": "The vehicle is backed up only when an observer signals that it is safe to do so.", "verified": "PASS"}]}, {"atom_id": "ATM-S2-019", "decision": "Can the operator see a person standing here?", "correct_action": "Recognize that construction equipment has blind areas where the operator cannot see objects by direct line of sight or mirrors, and use NIOSH's equipment-specific blind-area diagrams (ground, 900 mm and 1500 mm planes; 1500 mm ≈ a 4′11″ person) to learn where a person cannot be seen.", "force": "explains", "locator": "NIOSH 'Creating Blind Area Diagrams: Manual Method' (cdc.gov, Nov. 14, 2024), 'What it is'; NIOSH 'Construction Equipment Visibility' (Nov. 7, 2024), 'Diagram lookup'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/manual-method.html", "source": "Creating Blind Area Diagrams: Manual Method", "authority": "B", "status": "CURRENT", "page": null, "quote": "Blind areas are where the equipment operator cannot see objects by direct line of sight or mirrors.", "verified": "PASS"}, {"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/index.html", "source": "Construction Equipment Visibility", "authority": "B", "status": "CURRENT", "page": null, "quote": "The 900 mm plane represents the average height of a channelizing device. The 1500 mm plane corresponds to the height of a 4' 11\" person.", "verified": "PASS"}, {"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/test-procedure.html", "source": "Construction Equipment Visibility Test Procedure", "authority": "B", "status": "CURRENT", "page": null, "quote": "Safety personnel and instructors can use this resource as a training aid to increase awareness about limited-visibility areas around construction vehicles and equipment.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S2-015", "decision": "Is this an 'obstructed view to the rear' that triggers the alarm-or-observer requirement?", "locator": "OSHA memorandum, 1987-01-21 (J. Miles to R. Clark), interpretation of 29 CFR 1926.602(a)(9)(ii)", "force": "explains"}], "conflicts": [{"id": "CNF-006", "title": "OSHA allows a reverse alarm OR an observer; guidance may recommend more", "status": "OPEN", "implication": "Must not teach recommended extras as legal minimums, or the minimum as best practice.", "handling": "Label each control: 'required (OSHA)' vs 'recommended (NIOSH/ITCP)'.", "decision_by": "PI"}], "videos": [{"segment_id": "VID-_o0T9G40Ehc-SEG-03", "title": "Struck-by Accidents in Construction/Vehicle Back-Over", "channel": "USDepartmentofLabor", "url": "https://www.youtube.com/watch?v=_o0T9G40Ehc&t=105s", "start": "01:45", "end": "02:05", "label": "good example", "summary": "Narration states the rule: when a construction vehicle has an obstructed view to the rear, OSHA requires a working back-up alarm or a spotter who tells the driver when it is safe to back up.", "timing": "approximate (±8 s)", "transcript_url": "https://www.osha.gov/vtools/construction/struck-by-backover-fnl-eng-web-transcript", "review_status": "PENDING_PI_REVIEW", "flags": []}]}}, {"id": "loadSide", "role": "excavator operator", "keys": ["exc"], "call": "Excavator", "title": "Choose the bucket path", "timed": null, "situation": "You are the excavator operator. Truck 7 is spotted with its tailgate toward the cut, and you have a full bucket.", "question": "How do you load the first pass?", "lateBanner": null, "lateText": null, "lesson": "Follow this site loading plan: load over the tailgate/bed, keep the bucket path away from the occupied cab, and dump low and controlled.", "options": [{"correct": true, "text": "Swing over the tailgate and side of the bed, never over the cab, and set the material down low in the bed.", "why": "This site plan keeps the bucket/load path away from the occupied cab and keeps the dump low and controlled. OSHA 1926.651(e) requires employees to stay clear of handled loads and allows an operator to remain in a cab protected as required by 1926.601(b)(6); the no-over-cab path is this scenario’s additional conservative loading rule."}, {"text": "Take the shortest swing path, even across the cab. The truck has a cab protector built for exactly this.", "why": "A compliant cab protector addresses falling/shifting material exposure, but this site’s loading plan still keeps the bucket/load path away from the occupied cab. Follow the planned loading path rather than treating cab protection as permission to swing over the cab.", "risk": 25, "lost": 0, "banner": "Bucket swung over an occupied cab"}, {"text": "Dump from well above the bed so the bucket has no chance of clipping the sides or the tailgate on the way in.", "why": "Dropping from height slams the truck’s suspension and throws rock. Lower the bucket into the bed and release smoothly.", "risk": 10, "lost": 20, "banner": "Material dropped from height"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S2-004", "decision": "May the operator swing or hold the loaded bucket over the worker?", "correct_action": "Do not permit any employee underneath loads handled by lifting or digging equipment; do not swing or hold the bucket over people.", "force": "must", "locator": "29 CFR 1926.651(e)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.651(e)", "url": "https://www.ecfr.gov/current/title-29/section-1926.651", "source": "29 CFR 1926.650–1926.651 — Excavations: scope/definitions; specific excavation requirements (Part 1926, Subpart P)", "authority": "A", "status": "CURRENT", "page": null, "quote": "No employee shall be permitted underneath loads handled by lifting or digging equipment.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S2-005", "decision": "Where must the driver and other workers be during loading?", "locator": "29 CFR 1926.651(e)", "force": "must"}, {"atom_id": "ATM-S1-018", "decision": "What protection must the haulage vehicle have, and may the driver stay in the cab?", "locator": "29 CFR 1926.601(b)(6)", "force": "must"}], "conflicts": [], "videos": []}}, {"id": "driverStays", "role": "truck driver (Truck 7)", "keys": ["t7"], "call": "Truck 7", "title": "While you are being loaded", "timed": null, "situation": "The first bucket is in the bed, about {{fmtLb(BUCKET.PASS_KG)}} of clay, and there are {{DUMP.PASSES - 1}} more passes to go. You would like to see how the load is sitting.", "question": "What do you do during loading?", "lateBanner": null, "lateText": null, "lesson": "The driver stays in the protected cab with the brakes set; any adjustment is by call only.", "options": [{"correct": true, "text": "Stay in the cab with the brakes set and hands visible. If you want the load checked, ask the spotter over the radio.", "why": "This truck has a cab protector, so the cab is the safest place while the bucket is working. Standing beside the truck puts you where spillage lands."}, {"text": "Climb out and stand by the rear wheels where you can watch each bucket go in and see how the load sits.", "why": "People beside a truck being loaded get hit by spillage. OSHA’s excavation rules require workers to stand away from vehicles being loaded.", "risk": 25, "lost": 20, "banner": "Driver standing in the spill zone"}, {"text": "Pull ahead a few feet between passes, so the material spreads evenly and the axles share the load.", "why": "Moving without a call puts the truck where the operator doesn’t expect it, in the middle of a swing. Ask for the adjustment and wait for the signal.", "risk": 15, "lost": 30, "banner": "Truck moved mid-cycle without a call"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S2-005", "decision": "Where must the driver and other workers be during loading?", "correct_action": "Workers stand away from any vehicle being loaded or unloaded. The truck operator may remain in the cab only if the vehicle has a cab shield and/or canopy adequate to protect the operator (per §1926.601(b)(6)).", "force": "must", "locator": "29 CFR 1926.651(e)", "authority": "A", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "29 CFR 1926.651(e)", "url": "https://www.ecfr.gov/current/title-29/section-1926.651", "source": "29 CFR 1926.650–1926.651 — Excavations: scope/definitions; specific excavation requirements (Part 1926, Subpart P)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Employees shall be required to stand away from any vehicle being loaded or unloaded to avoid being struck by any spillage or falling materials.", "verified": "PASS"}, {"citation": "29 CFR 1926.651(e)", "url": "https://www.ecfr.gov/current/title-29/section-1926.651", "source": "29 CFR 1926.650–1926.651 — Excavations: scope/definitions; specific excavation requirements (Part 1926, Subpart P)", "authority": "A", "status": "CURRENT", "page": null, "quote": "Operators may remain in the cabs of vehicles being loaded or unloaded when the vehicles are equipped, in accordance with § 1926.601(b)(6), to provide adequate protection for the operator during loading and unloading operations.", "verified": "PASS"}, {"citation": "29 CFR 1926.601(b)(6)", "url": "https://www.ecfr.gov/current/title-29/section-1926.601", "source": "29 CFR 1926.600–1926.602 — Equipment; Motor vehicles; Material handling equipment (Part 1926, Subpart O)", "authority": "A", "status": "CURRENT", "page": null, "quote": "All haulage vehicles, whose pay load is loaded by means of cranes, power shovels, loaders, or similar equipment, shall have a cab shield and/or canopy adequate to protect the operator from shifting or falling materials.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S1-018", "decision": "What protection must the haulage vehicle have, and may the driver stay in the cab?", "locator": "29 CFR 1926.601(b)(6)", "force": "must"}], "conflicts": [{"id": "CNF-004", "title": "May a truck driver remain in the cab while a crane loads or unloads the truck?", "status": "OPEN", "implication": "The trainer could teach either 'stay in a shielded cab' or 'leave the fall zone' for crane loading; the texts do not settle it.", "handling": "Keep the S1 atom flagged. OSHA's 2001-02-28 letter confirms §1926.601(b)(6) applies to haulage vehicles loaded by cranes, power shovels, loaders etc. and that a cab shield protects against 'material falling from a loader bucket passing near or over the cab' — it does not address crane fall-zone rules (letter verified live 2026-10-07). No letter found on cab occupancy under Subpart CC. Until resolved, design S1 scenarios so the driver is outside the fall zone, and present the cab-shield rule only for excavator loading (S2).", "decision_by": "PI / safety SME"}], "videos": []}}, {"id": "tailSwing", "role": "spotter", "keys": ["spotter"], "call": "Spotter", "title": "Someone behind the excavator", "timed": 9, "situation": "The excavator is swinging back to the cut. The grade checker walks from the stake line toward the back of the machine to shoot grade, straight into the counterweight’s swing area. The operator is watching the bucket.", "question": "What do you do?", "lateBanner": "Too slow: the grade checker is inside the swing radius", "lateText": "The counterweight is sweeping toward the grade checker. The machine has to be stopped before anything else.", "lesson": "Someone in the swing radius: stop the machine first, then clear the area.", "options": [{"correct": true, "signal": "estop", "text": "Give the stop signal where the operator can see it, and call “Excavator, all stop, person behind you” on the radio.", "why": "The operator can’t see the counterweight’s tail. A stop call gets the machine still first; then you can clear the grade checker out."}, {"text": "Shout at the grade checker to get out of the way. They are much closer to you than the operator, so they will react first.", "why": "The excavator is loud and the grade checker may not hear you. The machine keeps swinging while you shout. Stop the machine first.", "risk": 20, "lost": 0, "banner": "Machine still swinging"}, {"text": "Walk over, take the grade checker by the arm and lead them out of the swing area yourself, right away.", "why": "Now two people are inside the swing radius of a moving machine. Stop it first.", "risk": 25, "lost": 0, "banner": "Two people inside the swing radius"}], "evidence": {"site_practice": false, "note": "Crane swing-radius rules (1926.1424) do not cover excavators; the counterweight hazard is handled through blind-area awareness and the stop call.", "teaches": [{"atom_id": "ATM-S2-019", "decision": "Can the operator see a person standing here?", "correct_action": "Recognize that construction equipment has blind areas where the operator cannot see objects by direct line of sight or mirrors, and use NIOSH's equipment-specific blind-area diagrams (ground, 900 mm and 1500 mm planes; 1500 mm ≈ a 4′11″ person) to learn where a person cannot be seen.", "force": "explains", "locator": "NIOSH 'Creating Blind Area Diagrams: Manual Method' (cdc.gov, Nov. 14, 2024), 'What it is'; NIOSH 'Construction Equipment Visibility' (Nov. 7, 2024), 'Diagram lookup'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/manual-method.html", "source": "Creating Blind Area Diagrams: Manual Method", "authority": "B", "status": "CURRENT", "page": null, "quote": "Blind areas are where the equipment operator cannot see objects by direct line of sight or mirrors.", "verified": "PASS"}, {"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/index.html", "source": "Construction Equipment Visibility", "authority": "B", "status": "CURRENT", "page": null, "quote": "The 900 mm plane represents the average height of a channelizing device. The 1500 mm plane corresponds to the height of a 4' 11\" person.", "verified": "PASS"}, {"citation": "part #1", "url": "https://www.cdc.gov/niosh/motor-vehicle/constructionequipmentvisibilitydiagram/test-procedure.html", "source": "Construction Equipment Visibility Test Procedure", "authority": "B", "status": "CURRENT", "page": null, "quote": "Safety personnel and instructors can use this resource as a training aid to increase awareness about limited-visibility areas around construction vehicles and equipment.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S2-013", "decision": "Does the crane standard (Subpart CC, incl. its signaling rules) apply to this lift?", "locator": "29 CFR 1926.1400(c)(2)", "force": "explains"}, {"atom_id": "ATM-S2-014", "decision": "What is needed before the excavator moves toward an area the operator cannot see — and what is the legal basis?", "locator": "OSHA interpretation letter, 1995-05-10 (R. Gurnham to J. Longo), standard 1926.602, second paragraph", "force": "explains"}], "conflicts": [], "videos": []}}, {"id": "loaded", "role": "excavator operator", "keys": ["exc"], "call": "Excavator", "title": "Truck 7 is full", "timed": null, "situation": "That was pass {{DUMP.PASSES}}: about {{fmtLb(DUMP.PASSES * BUCKET.PASS_KG)}} of clay puts Truck 7 near its {{fmtLb(DUMP.GVW_KG)}} legal gross weight, even though the bed is only about {{Math.round(DUMP.PASSES * BUCKET.M3 * BUCKET.FILL / DUMP.BED_M3 * 100)}}% full. The driver is waiting for word. Truck 9 is rolling up to the queue.", "question": "How do you send the truck off?", "lateBanner": null, "lateText": null, "lesson": "Send the truck with the agreed horn code and a radio call.", "options": [{"correct": true, "signal": "horn2", "text": "Two short blasts and “Truck 7, you’re loaded, pull out” on the radio, with the bucket parked clear.", "why": "The horn and the radio say the same thing two ways, so it lands even on a noisy pad. Parking the bucket away from the truck removes the last overhead hazard."}, {"text": "Nothing. The driver can feel the truck settle on its springs and will know when it has reached its weight.", "why": "Drivers can’t see the load. Without a call they either leave short or sit and wait, and both cost time.", "risk": 5, "lost": 60, "banner": "Truck sitting idle with no call"}, {"text": "Wave the empty bucket toward the exit, so the driver can see in the mirror that it is time to pull out.", "why": "A bucket wave isn’t one of the agreed signals, and it puts the bucket in motion near the truck.", "risk": 15, "lost": 20, "banner": "Bucket waved near the truck"}], "evidence": {"site_practice": true, "note": null, "teaches": [], "context": [{"atom_id": "ATM-S2-003", "decision": "What audible warning must the machine have and use?", "locator": "29 CFR 1926.602(a)(9)(i)", "force": "must"}, {"atom_id": "ATM-S2-018", "decision": "What plan covers vehicles and equipment inside the work space?", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Overview of ITCPs'", "force": "example practice"}], "conflicts": [], "videos": []}}, {"id": "nextTruck", "role": "truck driver (Truck 9)", "keys": ["t9"], "call": "Truck 9", "title": "The next truck", "timed": null, "situation": "You are driving Truck 9, waiting at the queue on the haul road. Truck 7 has just pulled out of the loading lane.", "question": "When do you move up and back in?", "lateBanner": null, "lateText": null, "lesson": "One truck in the loading area at a time: stage, then wait for the call.", "options": [{"correct": true, "text": "After Truck 7 has cleared the loading area, drive to the staging cone and wait for three short blasts.", "why": "One truck in the loading area at a time. Staging keeps the next load ready so the excavator isn’t waiting, without putting two trucks in the swing radius."}, {"text": "Follow Truck 7 out closely and swing straight into the lane, so the excavator never sits waiting.", "why": "Two trucks moving in the loading area at once means one driver is maneuvering around someone they can’t see.", "risk": 20, "lost": 0, "banner": "Two trucks moving in the loading area"}, {"text": "Start backing in as soon as you see Truck 7 begin to move, since the lane will be clear by then.", "why": "Truck 7 might stop or shift. Wait until it has cleared and the operator calls you in.", "risk": 20, "lost": 0, "banner": "Backing in before the lane is clear"}], "evidence": {"site_practice": false, "note": null, "teaches": [{"atom_id": "ATM-S2-018", "decision": "What plan covers vehicles and equipment inside the work space?", "correct_action": "Use an internal traffic control plan to coordinate and control the flow of construction vehicles, equipment and workers within the work zone, separating vehicles and equipment from workers on foot to the extent possible.", "force": "example practice", "locator": "NIOSH Science Bulletin, 'Using Internal Traffic Control Plans…' (posted 2024-04-10), section 'Overview of ITCPs'", "authority": "B", "review_status": "PENDING_PI_REVIEW", "needs_review": false, "review_reasons": [], "quotes": [{"citation": "part #2", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "temporary traffic control plans do not address construction equipment and vehicles within the workspace – these types of hazards are addressed in an ITCP.", "verified": "PASS"}, {"citation": "part #3", "url": "https://www.cdc.gov/niosh/bulletin/2024/struck-by.html", "source": "Using Internal Traffic Control Plans to Prevent Construction Worker Injuries and Fatalities in Work Zones (NIOSH Science Bulletin)", "authority": "B", "status": "CURRENT", "page": null, "quote": "The purpose of an ITCP is to separate—to the extent possible—vehicles and equipment from on-foot workers and to prevent struck by incidents.", "verified": "PASS"}]}], "context": [{"atom_id": "ATM-S4-015", "decision": "How should vehicle and equipment movements in the work space be planned?", "locator": "MUTCD 11th Ed. (Rev. 1), Section 6C.04 ¶02 (Support), ¶03 item D (Guidance), PDF p. 822 (printed 781)", "force": "should"}], "conflicts": [], "videos": []}}]}}, "signals": {"hoist": {"name": "Hoist", "basis": "OSHA_APPENDIX_A", "how": "With upper arm extended to the side, forearm and index finger pointing straight up, hand and finger make small circles.", "src": "OSHA 29 CFR 1926 Subpart CC /* Hook-load pendulum. The hoist line hangs from the boom tip, so when the tip accelerates (starting or
   stopping the swing, plus the centripetal pull while swinging) the girder lags and swings with period
   2*pi*sqrt(L/g). The tag line and air drag damp it; a damping ratio of 0.25 is assumed. */
function updateSway(a, dt) {
  const w = a.sway, cs = a.cs, tip = a.crane.tip, h = dt * simSpeed;
  if (!(h > 0)) return;
  if (!w.init) { Object.assign(w, { px: tip.x, pz: tip.z, vx: 0, vz: 0, init: true }); return; }
  const vx = (tip.x - w.px) / h, vz = (tip.z - w.pz) / h;
  let ax = (vx - w.vx) / h, az = (vz - w.vz) / h; const am = Math.hypot(ax, az);
  if (am > 1.5) { ax *= 1.5 / am; az *= 1.5 / am; }
  Object.assign(w, { px: tip.x, pz: tip.z, vx, vz });
  if (a.loadMode !== 'hook') { cs.dx = cs.dz = w.ux = w.uz = 0; return; }
  const Lp = Math.max(1, tip.y - (cs.hookY - CR.HOOK_TO_LOAD + BT.H / 2)), k = 9.81 / Lp, c = 2 * .25 * Math.sqrt(k);
  const n = Math.ceil(h / .01), s = h / n;
  for (let i = 0; i < n; i++) {
    w.ux += (-k * cs.dx - ax - c * w.ux) * s; w.uz += (-k * cs.dz - az - c * w.uz) * s;
    cs.dx += w.ux * s; cs.dz += w.uz * s;
  }
}

  const L = a.load, hk = a.crane.hook.position;

    a.truck.updateMatrixWorld(true); a.truck.localToWorld(L.position.set(0, CR.DECK, 0)); L.rotation.y = a.truck.rotation.y;
  } else if (a.loadMode === 'hook') {
    L.position.set(hk.x, a.cs.hookY - CR.HOOK_TO_LOAD, hk.z); L.rotation.y = a.cs.slew - CR.SLEW0;

    if (a.rigged) { _a.set(hk.x, a.cs.hookY, hk.z); L.localToWorld(_b.set(i ? LIFT.LOOP_X : -LIFT.LOOP_X, LIFT.LOOP_Y, 0)); setBetween(a.slings[i], _a, _b); }

/* ============================== content from the knowledge graph ==============================
   Scenario text, steps, answer options, feedback and evidence come from the content pack. {{...}} placeholders
   are filled from the computed physical values (which themselves come from pack parameters). */
(function applyPack() {
  const scope = { fmtLb, fmtT, LIFT, CR, chartKg, chartPct, M_PER_FT, LBKG, DUMP, BUCKET, SOIL, PV, Math };
  const names = Object.keys(scope), vals = names.map(k => scope[k]);
  const fill = s => typeof s !== 'string' ? s : s.replace(/\{\{([\s\S]+?)\}\}/g, (_, e) => String(Function(...names, '"use strict"; return (' + e + ');')(...vals)));
  for (const [k, s] of Object.entries(PACK.signals)) {
    if (!SIGNALS[k]) continue;
    Object.assign(SIGNALS[k], { name: s.name, how: s.how, src: s.src, basis: s.basis, verification: s.verification });
    if (s.pattern) SIGNALS[k].pattern = s.pattern;
  }
  for (const sc of Object.values(SCENARIOS)) {
    const p = PACK.scenarios[sc.key];
    if (!p) throw new Error('content pack has no scenario ' + sc.key);
    Object.assign(sc, { title: p.title, sub: p.sub, channel: p.channel, camLabels: p.camLabels, briefKeys: p.briefKeys,
      briefCall: p.briefCall, briefing: fill(p.briefing), conflicts: p.conflicts || [] });
    for (const st of sc.steps) {
      const ps = p.steps.find(x => x.id === st.id);
      if (!ps) throw new Error('content pack has no step ' + sc.key + '/' + st.id);
      for (const k of ['role', 'keys', 'call', 'title', 'timed', 'situation', 'question', 'lateBanner', 'lateText', 'lesson']) if (ps[k] != null) st[k] = fill(ps[k]);
      st.options = ps.options.map(o => Object.assign({}, o, { text: fill(o.text), why: fill(o.why) }));
      st.evidence = ps.evidence;
    }
  }
})();

/* Reviewer view (add ?review to the address): shows the evidence behind each step. Trainees never see it;
   their page shows only the scenario and the plain-language feedback. */
const REVIEW = /[?&]review(?=[=&#]|$)/.test(location.search);

/* "Source text" panel shown with the feedback on a right call, reviewer view only */
function evidenceHtml(st) {
  const ev = st.evidence; if (!REVIEW || !ev) return '';
  const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
  let h = '';
  if (ev.site_practice) h += `<p class="ev-note"><b>Site practice, not a regulation.</b> ${esc(ev.note || 'The right call rests on this crew’s agreed procedure.')}</p>`;
  else if (ev.note) h += `<p class="ev-note">${esc(ev.note)}</p>`;
  const seen = new Set();
  for (const a of ev.teaches) for (const q of a.quotes) {
    if (seen.has(q.quote)) continue; seen.add(q.quote);
    const force = a.force || 'explains';
    h += `<blockquote class="ev-q"><span class="ev-force f-${esc(force.split(' ')[0])}">${esc(force)}</span><q>${esc(q.quote)}</q>` +
      `<cite>${link(q.url, q.citation)}${q.status && q.status !== 'CURRENT' ? ' (' + esc(q.status.toLowerCase().replace('_', ' ')) + ')' : ''}</cite></blockquote>`;
  }
  for (const v of ev.videos) {
    h += `<p class="ev-vid"><b>Video, ${esc(v.label)}:</b> ${link(v.url, v.title)}, ${esc(v.start)}–${esc(v.end)} (times approximate)` +
      (v.transcript_url ? ` · ${link(v.transcript_url, 'official transcript')}` : '') +
      (v.flags && v.flags.length ? `<span class="ev-flag">Reviewer note: ${esc(v.flags.join(' '))}</span>` : '') + '</p>';
  }
  for (const c of ev.conflicts) h += `<p class="ev-cnf"><b>Open question (${esc(c.id)}):</b> ${esc(c.title)} ${esc(c.implication || '')}</p>`;
  if (ev.context && ev.context.length) h += `<p class="ev-ctx">Related: ${ev.context.map(c => esc(c.locator)).join('; ')}</p>`;
  if (!h) return '';
  const draft = ev.teaches.some(a => a.review_status !== 'APPROVED');
  return `<details class="ev"><summary>Source text${draft ? '<span class="ev-draft">(draft, awaiting expert review)</span>' : ''}</summary><div>${h}</div></details>`;
}
function briefingSources(sc) {
  if (!REVIEW) return '';
  const c = (sc.conflicts || []).map(x => `<li><b>${esc(x.id)}</b> ${esc(x.title)}</li>`).join('');
  return `<div class="ev-meta">${c ? `<p><b>Open questions in the source corpus for this scenario:</b></p><ul>${c}</ul>` : ''}` +
    `<p>This content comes from the project knowledge graph (${PACK.meta.graph_nodes.toLocaleString('en-US')} nodes, built ${esc(PACK.meta.built_utc.slice(0, 10))}). ` +
    `${esc(PACK.meta.review_notice)} Reviewer view: after each right call, open <b>Source text</b> to read the regulation passages behind it. Trainees do not see this.</p></div>`;
}

    const label = r === 'ok' ? 'Right first time' : r === 'late' ? 'Too slow on the stop call' : 'Needed a second try';
    const m = !marks ? String(i + 1) : r === 'ok' ? '\u2713' : r === 'late' ? '!' : '\u21ba';
    return `<li class="${marks ? r : 'ok'}"><span class="m" title="${marks ? label : ''}">${m}</span><div><b>${esc(s.title)}</b><span>${esc(s.lesson)}</span></div></li>`;
  }).join('')}</ol>`;
}
function debrief() {
  ix = SC.steps.length; youCall = ''; highlightTags([]); hideSignal(); renderProgress();
  const total = SC.steps.length, other = Object.keys(SCENARIOS).find(k => k !== cur), otherTitle = SCENARIOS[other].title.toLowerCase();
  if (mode === 'demo') {
    card.innerHTML = `<div class="debrief"><div class="role"><i></i>Demo complete</div>
      <h2>What the crew got right</h2>${lessonsList(false)}
      <div class="btnrow"><button class="next go" id="dA">Practice it yourself</button><button class="next" id="dB">Watch ${esc(otherTitle)}</button></div></div>`;
    $('#dA').onclick = () => setMode('practice');
    $('#dB').onclick = () => loadScenario(other);
    card.scrollTop = 0; return;
  }
  const elapsed = (performance.now() - run.start) / 1000, acc = run.first / total;
  const verdict = run.safety >= 90 && acc >= .8
    ? 'Solid shift. Your calls were clear and came in the right order. Before field use, verify the actual lift plan/load chart and site conditions; crane signal persons must meet OSHA 1926.1428 qualification/documentation requirements.'
    : run.safety >= 70
      ? 'Close. Go back over the steps marked in amber or red, then run the scenario again.'
      : 'Not ready yet. Several of these calls would have put someone in the line of fire. Watch the demo, then try again.';
  const key = 'callsignal-best-' + cur, best = store.get(key);
  const isBest = !best || run.safety > best.safety || (run.safety === best.safety && run.first > best.first);
  if (isBest) store.set(key, { safety: run.safety, first: run.first, total });
  const bestLine = best && !isBest ? `<p style="color:var(--ink-2);font-size:14px;margin:4px 0 0">Your best on this scenario: safety ${best.safety}, ${best.first} of ${best.total} right first time.</p>`
    : best ? '<p style="font-size:14px;margin:4px 0 0">New personal best on this scenario.</p>' : '';
  card.innerHTML = `<div class="debrief"><div class="role"><i></i>Debrief</div>
    <h2>How the shift went</h2>
    <div class="dstats">
      <div><b>${run.safety}</b><span>Safety score</span></div>
      <div><b>${run.first} of ${total}</b><span>Right first time</span></div>
      <div><b>${fmtTime(run.lost)}</b><span>Lost time from wrong calls</span></div>
      <div><b>${fmtTime(elapsed)}</b><span>Time on task</span></div>
    </div>
    <div class="verdict">${verdict}</div>${bestLine}
    <h3>Step by step</h3>${lessonsList(true)}
    <div class="btnrow"><button class="next go" id="dA">Run it again</button><button class="next" id="dB">Try ${esc(otherTitle)}</button></div></div>`;
  $('#dA').onclick = () => loadScenario(cur);
  $('#dB').onclick = () => loadScenario(other);
  card.scrollTop = 0;
}
function setMode(m) { mode = m; loadScenario(cur); }

/* ============================== cameras ============================== */
let camMode = 'overview', camFly = null, camSnap = false;
const camPos = V(), camLookT = V(), camLook = V();
function setCam(m) {
  camMode = m; camFly = null;
  $$('#camBtns button').forEach(b => b.classList.toggle('on', b.dataset.cam === m));
  if (m === 'overview' || m === 'top') {
    controls.enabled = true; camera.fov = 45; camera.updateProjectionMatrix();
    const f = m === 'top' ? SC.top : (ix >= 0 && ix < SC.steps.length && SC.steps[ix].frame) || SC.overview;
    camera.position.set(f[0], f[1], f[2]); controls.target.set(f[3], f[4], f[5]); controls.update();
  } else {
    controls.enabled = false; camera.fov = 62; camera.updateProjectionMatrix(); camSnap = true;
  }
}
function flyTo(f) {
  if (!f || camMode !== 'overview') return;
  if (reduceMotion) { camera.position.set(f[0], f[1], f[2]); controls.target.set(f[3], f[4], f[5]); return; }
  const p0 = camera.position.clone(), p1 = V(f[0], f[1], f[2]);
  camFly = { t: 0, dur: 1.9, p0, t0: controls.target.clone(), p1, t1: V(f[3], f[4], f[5]), lift: Math.min(30, p0.distanceTo(p1) * .35) };
}
controls.addEventListener('start', () => { camFly = null; });
function updateCamera(dt) {
  if (camFly) {
    camFly.t += dt; const k = ease(Math.min(1, camFly.t / camFly.dur));
    camera.position.lerpVectors(camFly.p0, camFly.p1, k); camera.position.y += Math.sin(Math.PI * k) * camFly.lift;
    controls.target.lerpVectors(camFly.t0, camFly.t1, k);
    if (k >= 1) camFly = null;
  }
  if (camMode === 'overview' || camMode === 'top') { controls.update(); return; }
  const fn = SC && SC.cams[camMode]; if (!fn || !A) return;
  const snap = fn(camPos, camLookT) === true;
  if (camSnap || snap) { camera.position.copy(camPos); camLook.copy(camLookT); camSnap = false; }
  else { const k = 1 - Math.exp(-dt * 7); camera.position.lerp(camPos, k); camLook.lerp(camLookT, k); }
  camera.lookAt(camLook);
}

/* ============================== controls wiring ============================== */
$$('#scTabs button').forEach(b => b.addEventListener('click', () => loadScenario(b.dataset.sc)));
$$('#modeTabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#restartBtn').addEventListener('click', () => loadScenario(cur));
$$('#camBtns button').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));
$$('#speedBtns button').forEach(b => b.addEventListener('click', () => {
  simSpeed = +b.dataset.speed;
  $$('#speedBtns button').forEach(x => x.classList.toggle('on', x === b));
  if (simSpeed > 1 && window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
}));
$('#zonesBtn').addEventListener('click', e => {
  zonesOn = !zonesOn; e.currentTarget.setAttribute('aria-pressed', String(zonesOn));
  zones.forEach(z => { z.visible = zonesOn; });
});
$('#soundBtn').addEventListener('click', e => {
  soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) { ensureAudio(); if (window.speechSynthesis) speechSynthesis.getVoices(); }
  else if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (err) {}
});
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const cams = { '1': 'overview', '2': 'operator', '3': 'driver', '4': 'signal', '5': 'top' };
  if (cams[k]) { setCam(cams[k]); return; }
  if (k.length === 1 && 'abc'.includes(k) && run && !run.locked && ix >= 0 && ix < SC.steps.length) { choose('abc'.indexOf(k)); return; }
  if (k === 'n' && run && run.done) nextStep();
});
if (window.speechSynthesis) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {}

/* ============================== physics readout ============================== */
const physEl = $('#phys');
let physT = 0, physHtml = '';
function updatePhys(dt) {
  physT -= dt; if (physT > 0) return; physT = .2;
  const html = SC && A && SC.phys ? SC.phys() || '' : '';
  if (html === physHtml) return;
  physHtml = html; physEl.innerHTML = html; physEl.hidden = !html;
}
const meter = (frac, warnAt = .75, overAt = 1) => {
  const k = frac >= overAt ? 'over' : frac >= warnAt ? 'warn' : '';
  return { k, bar: `<div class="bar"><i class="${k}" style="width:${Math.min(100, frac * 100).toFixed(1)}%"></i></div>` };
};

/* ============================== debug monitor (?debug in the URL) ==============================
   Records any person standing inside a vehicle or machine footprint, any upright cone or drum inside
   one, and any two footprints that overlap, so scripted paths can be checked automatically. */
const DEBUG = /[?&]debug\b/.test(location.search);
const dbg = { hits: [], seen: new Set() };
function rectsOverlap(a, b) {
  const ax = [[a.c, -a.n], [a.n, a.c]], bx = [[b.c, -b.n], [b.n, b.c]];
  for (const [ux, uz] of [...ax, ...bx]) {
    const pr = (f, fx) => Math.abs(f.hx * (fx[0][0] * ux + fx[0][1] * uz)) + Math.abs(f.hz * (fx[1][0] * ux + fx[1][1] * uz));
    const d = Math.abs((b.x - a.x) * ux + (b.z - a.z) * uz);
    if (d >= pr(a, ax) + pr(b, bx)) return false;
  }
  return true;
}
function debugCheck() {
  if (!SC || !A) return;
  const step = SC.steps[ix] ? SC.steps[ix].id : ix < 0 ? 'briefing' : 'debrief';
  const rec = (key, what) => { const k = cur + '|' + step + '|' + key; if (!dbg.seen.has(k)) { dbg.seen.add(k); dbg.hits.push({ sc: cur, step, what }); } };
  const fps = solids.filter(solidOn).map(s => footprint(s, .15));
  people.forEach((p, i) => {
    if (!p.visible || p.position.y > .05) return;
    for (const f of fps) if (inFp(f, p.position.x, p.position.z)) rec('p' + i + f.s.name, `person ${i} at (${p.position.x.toFixed(1)}, ${p.position.z.toFixed(1)}) inside ${f.s.name}`);
  });
  const raw = solids.filter(solidOn).map(s => footprint(s));
  for (const d of devices) {
    if (d.down || !d.g.visible) continue;
    // a cone or drum base is about 0.4 m across
    for (const f of raw) if (inFp(f, d.g.position.x, d.g.position.z, .2)) rec('d' + d.home.x.toFixed(0) + f.s.name, `device at (${d.g.position.x.toFixed(1)}, ${d.g.position.z.toFixed(1)}) inside ${f.s.name} centred (${f.x.toFixed(1)}, ${f.z.toFixed(1)}) half ${f.hx.toFixed(2)} x ${f.hz.toFixed(2)} rot ${f.s.obj.rotation.y.toFixed(2)}`);
  }
  for (let i = 0; i < fps.length; i++) for (let j = i + 1; j < fps.length; j++) {
    if (fps[i].s.traffic && fps[j].s.traffic) continue;
    const a = footprint(fps[i].s), b = footprint(fps[j].s);
    if (rectsOverlap(a, b)) rec('o' + fps[i].s.name + fps[j].s.name + i + j, `${fps[i].s.name} overlaps ${fps[j].s.name} near (${a.x.toFixed(1)}, ${a.z.toFixed(1)})`);
  }
}
/* fast-forward driver for automated checks: answers every step correctly and steps the simulation
   without rendering, so it also runs while the page is hidden */
async function debugRun(maxTicks = 40000, dt = .05) {
  const yieldTask = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
  dbg.phys = [];
  for (let i = 0; i < maxTicks; i++) {
    if (ix >= SC.steps.length) return { result: 'finished', ticks: i };
    if (ix < 0) $('#startBtn').click();
    else if (!run.locked) choose(run.order.findIndex(o => o.correct));
    else if (run.done) nextStep();
    updateTweens(dt); if (SC && A) { updateTraffic(dt); SC.update(dt); }
    updateBlinkers(); updatePeople(dt); updateParticles(dt); debugCheck();
    if (i % 4 === 0) window.__cs.trace.push([cur, SC.steps[ix] ? SC.steps[ix].id : '-', people.map(p => p.visible && p.position.y < .05 ? [+p.position.x.toFixed(2), +p.position.z.toFixed(2)] : null)]);
    if (SC.phys && i % 40 === 0) dbg.phys.push((SC.steps[ix] ? SC.steps[ix].id : '-') + ': ' + SC.phys().replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
    await yieldTask();
  }
  return { result: 'timeout', step: SC.steps[ix] && SC.steps[ix].id };
}
if (DEBUG) window.__cs = { dbg, run: debugRun, load: k => loadScenario(k),
  fps: () => solids.filter(solidOn).map(s => { const f = footprint(s); return { name: s.name, x: +f.x.toFixed(2), z: +f.z.toFixed(2), hx: +f.hx.toFixed(2), hz: +f.hz.toFixed(2), rot: +s.obj.rotation.y.toFixed(3), traffic: !!s.traffic }; }),
  probe: (x, z) => solids.filter(solidOn).map(s => footprint(s, .15)).filter(f => inFp(f, x, z)).map(f => f.s.name),
  trace: [],
  people: () => people.map((p, i) => ({ i, x: +p.position.x.toFixed(2), y: +p.position.y.toFixed(2), z: +p.position.z.toFixed(2), vis: p.visible })), state: () => ({ cur, ix, mode, steps: SC ? SC.steps.length : 0, done: !!(run && run.done), solids: solids.length }) };

/* ============================== loop ============================== */
const clock = new THREE.Clock();
let firstFrame = true;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, clock.getDelta());
  updateTweens(dt);
  if (SC && A) { updateTraffic(dt); SC.update(dt); }
  updateBlinkers();
  updatePeople(dt); updateParticles(dt); updateZones(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
  updateTags(); updatePhys(dt);
  if (DEBUG) debugCheck();
  if (firstFrame) { firstFrame = false; const l = $('#loading'); if (l) l.remove(); }
}
loadScenario(Object.keys(SCENARIOS)[0]);
frame();
})();
</script>
